<!-- @spec-kitty/styles — sk-data-table (sticky header modifier) -->

     is vertical, not the horizontal case that triad documents, and a hardcoded
     max-height would hard-cap every consumer who pastes this markup. The
     story wraps this exact markup with a max-height purely to make the
     sticky behaviour demonstrable in Storybook -- see sk-data-table-html.stories.ts. -->
