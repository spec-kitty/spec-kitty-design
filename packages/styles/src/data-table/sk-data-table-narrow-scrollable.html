<!-- @spec-kitty/styles — sk-data-table (narrow-width, keyboard-scrollable region) -->
<!-- SC-003 load-bearing exemplar: role="region" + accessible name + tabindex="0"
     wrapping an INTACT table — same <th scope> usage and cell structure as
     sk-data-table-default.html. No hardcoded width here -- the story wraps this
     exact markup in a max-width container purely to force the narrow condition
     for the demo, so a consumer pasting this exemplar is not hard-capped.
     aria-label is deliberately distinct from <caption> ("narrow view", not
     "Recent builds" again) -- a duplicate name is itself a defect, copying
     the sticky-header exemplar's own distinct-name habit. -->
<div class="sk-data-table__scroller" role="region" aria-label="Recent builds, narrow view" tabindex="0">
  <table class="sk-data-table">
    <caption>Recent builds</caption>
    <thead>
      <tr>
        <th scope="col">Build</th>
        <th scope="col">Branch</th>
        <th scope="col">Status</th>
        <th scope="col">Duration</th>
        <th scope="col">Cost</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>#1042</td>
        <td>main</td>
        <td>Passed</td>
        <td>3m 12s</td>
        <td class="sk-data-table__cell--numeric">$0.42</td>
      </tr>
      <tr>
        <td>#1041</td>
        <td>feature/skip-link</td>
        <td>Passed</td>
        <td>2m 58s</td>
        <td class="sk-data-table__cell--numeric">$0.38</td>
      </tr>
      <tr>
        <td>#1040</td>
        <td>main</td>
        <td>Failed</td>
        <td>1m 05s</td>
        <td class="sk-data-table__cell--numeric">$0.15</td>
      </tr>
    </tbody>
  </table>
</div>
