<!-- @spec-kitty/styles — sk-data-table (default, wide) -->
<!-- Requires @spec-kitty/tokens to be loaded in the consuming page -->
<!-- No role="region"/tabindex="0" here: measured, on a wide table where
     scrollWidth === clientWidth, that triad is a dead tab stop (arrow keys
     move nothing) and a duplicate landmark whose name repeats <caption>.
     That triad belongs only on a scroller that genuinely overflows -- see
     sk-data-table-narrow-scrollable.html. -->
<div class="sk-data-table__scroller">
  <table class="sk-data-table">
    <caption>Recent builds</caption>
    <thead>
      <tr>
        <th scope="col">Build</th>
        <th scope="col">Branch</th>
        <th scope="col">Status</th>
        <th scope="col">Duration</th>
        <th scope="col">Cost</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>#1042</td>
        <td>main</td>
        <td>Passed</td>
        <td>3m 12s</td>
        <td class="sk-data-table__cell--numeric">$0.42</td>
      </tr>
      <tr>
        <td>#1041</td>
        <td>feature/skip-link</td>
        <td>Passed</td>
        <td>2m 58s</td>
        <td class="sk-data-table__cell--numeric">$0.38</td>
      </tr>
      <tr>
        <td>#1040</td>
        <td>main</td>
        <td>Failed</td>
        <td>1m 05s</td>
        <td class="sk-data-table__cell--numeric">$0.15</td>
      </tr>
      <tr>
        <td>#1039</td>
        <td>main</td>

        <td class="sk-data-table__cell--numeric">$0.46</td>
      </tr>
    </tbody>
  </table>
</div>
