<!-- Native public header with consumer-owned link and button actions. -->
<header class="sk-public-header">
  <div class="sk-public-header__inner">
    <a class="sk-public-header__brand" href="/">Spec Kitty</a>
    <nav class="sk-public-header__actions" aria-label="Account controls">
      <a
        class="sk-public-header__action sk-button sk-button--ghost sk-button--sm"
        href="/accounts/"
        >Account</a
      >
      <button
        class="sk-public-header__action sk-button sk-button--secondary sk-button--sm"
        type="button"
      >
        Open preferences
      </button>
    </nav>
  </div>
</header>
