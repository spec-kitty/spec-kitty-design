<!-- @spec-kitty/styles — open one-item native collection -->
<section class="sk-collection" aria-labelledby="collection-one-item-heading">
  <div class="sk-collection__header">
    <h3 class="sk-collection__heading" id="collection-one-item-heading">Single-item collection</h3>
    <span class="sk-collection__count">1 item</span>
    <button class="sk-collection__toggle" type="button" aria-expanded="true" aria-controls="collection-one-item-body">
      <span class="sk-collection__marker" aria-hidden="true">▸</span>
      <span class="sk-collection__state-label">Collapse collection</span>
    </button>
  </div>
  <div class="sk-collection__body" id="collection-one-item-body">
    <ul class="sk-collection__list">
      <li class="sk-collection__item">Only collection item</li>
    </ul>
    <footer class="sk-collection__footer">
      <a class="sk-collection__action" href="#more-items">View more</a>
    </footer>
  </div>
</section>
