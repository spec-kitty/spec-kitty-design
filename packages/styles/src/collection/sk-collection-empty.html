<!-- @spec-kitty/styles — open empty native collection without invented placeholder copy -->
<section class="sk-collection" aria-labelledby="collection-empty-heading">
  <div class="sk-collection__header">
    <h3 class="sk-collection__heading" id="collection-empty-heading">Empty collection</h3>
    <span class="sk-collection__count">0 items</span>
    <button class="sk-collection__toggle" type="button" aria-expanded="true" aria-controls="collection-empty-body">
      <span class="sk-collection__marker" aria-hidden="true">▸</span>
      <span class="sk-collection__state-label">Collapse collection</span>
    </button>
  </div>
  <div class="sk-collection__body" id="collection-empty-body">
    <ul class="sk-collection__list"></ul>
    <footer class="sk-collection__footer">
      <a class="sk-collection__action" href="#more-items">View more</a>
    </footer>
  </div>
</section>
