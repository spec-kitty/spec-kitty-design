<!-- @spec-kitty/styles — open native collection without footer -->
<section class="sk-collection" aria-labelledby="collection-no-footer-heading">
  <div class="sk-collection__header">
    <h3 class="sk-collection__heading" id="collection-no-footer-heading">Collection without a footer</h3>
    <span class="sk-collection__count">3 items</span>
    <button class="sk-collection__toggle" type="button" aria-expanded="true" aria-controls="collection-no-footer-body">
      <span class="sk-collection__marker" aria-hidden="true">▸</span>
      <span class="sk-collection__state-label">Collapse collection</span>
    </button>
  </div>
  <div class="sk-collection__body" id="collection-no-footer-body">
    <ul class="sk-collection__list">
      <li class="sk-collection__item">Collection item 01</li>
      <li class="sk-collection__item">Collection item 02</li>
      <li class="sk-collection__item">Collection item 03</li>
    </ul>
  </div>
</section>
