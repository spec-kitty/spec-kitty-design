<!-- @spec-kitty/styles — open native collection with count and footer -->
<section class="sk-collection" aria-labelledby="collection-open-heading">
  <div class="sk-collection__header">
    <h3 class="sk-collection__heading" id="collection-open-heading">Sample collection</h3>
    <span class="sk-collection__count">3 items</span>
    <button class="sk-collection__toggle" type="button" aria-expanded="true" aria-controls="collection-open-body">
      <span class="sk-collection__marker" aria-hidden="true">▸</span>
      <span class="sk-collection__state-label">Collapse collection</span>
    </button>
  </div>
  <div class="sk-collection__body" id="collection-open-body">
    <ul class="sk-collection__list">
      <li class="sk-collection__item">Collection item 01</li>
      <li class="sk-collection__item">Collection item 02</li>
      <li class="sk-collection__item">Collection item 03</li>
    </ul>
    <footer class="sk-collection__footer">
      <a class="sk-collection__action" href="#more-items">View more</a>
    </footer>
  </div>
</section>
