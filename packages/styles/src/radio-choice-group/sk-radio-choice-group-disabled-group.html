<!-- @spec-kitty/styles — every choice in the group disabled, one already locked-selected (#336) -->
<fieldset class="sk-radio-choice-group">
  <legend class="sk-radio-choice-group__legend">Connect a workspace</legend>
  <div class="sk-radio-choice-group__options">
    <label class="sk-radio-choice-group__choice" for="sk-radio-disabled-group-acme"><input id="sk-radio-disabled-group-acme" class="sk-radio-choice-group__control" type="radio" name="workspace_disabled_group" value="acme" checked disabled><span class="sk-radio-choice-group__label">Acme</span><span class="sk-radio-choice-group__secondary-value">acme</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-disabled-group-acme-platform"><input id="sk-radio-disabled-group-acme-platform" class="sk-radio-choice-group__control" type="radio" name="workspace_disabled_group" value="acme-platform" disabled><span class="sk-radio-choice-group__label">Acme / Platform</span><span class="sk-radio-choice-group__secondary-value">acme/platform</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-disabled-group-northwind"><input id="sk-radio-disabled-group-northwind" class="sk-radio-choice-group__control" type="radio" name="workspace_disabled_group" value="northwind" disabled><span class="sk-radio-choice-group__label">Northwind</span><span class="sk-radio-choice-group__secondary-value">northwind</span></label>
  </div>
</fieldset>
