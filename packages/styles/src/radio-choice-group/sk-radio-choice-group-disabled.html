<!-- @spec-kitty/styles — a disabled-and-checked locked choice plus one plain disabled option (#336) -->
<fieldset class="sk-radio-choice-group">
  <legend class="sk-radio-choice-group__legend">Connect a workspace</legend>
  <div class="sk-radio-choice-group__options">
    <label class="sk-radio-choice-group__choice" for="sk-radio-disabled-acme"><input id="sk-radio-disabled-acme" class="sk-radio-choice-group__control" type="radio" name="workspace_disabled" value="acme" checked disabled><span class="sk-radio-choice-group__label">Acme</span><span class="sk-radio-choice-group__secondary-value">acme</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-disabled-acme-platform"><input id="sk-radio-disabled-acme-platform" class="sk-radio-choice-group__control" type="radio" name="workspace_disabled" value="acme-platform"><span class="sk-radio-choice-group__label">Acme / Platform</span><span class="sk-radio-choice-group__secondary-value">acme/platform</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-disabled-northwind"><input id="sk-radio-disabled-northwind" class="sk-radio-choice-group__control" type="radio" name="workspace_disabled" value="northwind" disabled><span class="sk-radio-choice-group__label">Northwind</span><span class="sk-radio-choice-group__secondary-value">northwind</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-disabled-northwind-labs"><input id="sk-radio-disabled-northwind-labs" class="sk-radio-choice-group__control" type="radio" name="workspace_disabled" value="northwind-labs"><span class="sk-radio-choice-group__label">Northwind / Labs</span><span class="sk-radio-choice-group__secondary-value">northwind/labs</span></label>
  </div>
</fieldset>
