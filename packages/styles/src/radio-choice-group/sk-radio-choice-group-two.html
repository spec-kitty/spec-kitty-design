  <legend class="sk-radio-choice-group__legend">Connect a workspace</legend>
  <div class="sk-radio-choice-group__options">

    <label class="sk-radio-choice-group__choice" for="sk-radio-two-acme-platform"><input id="sk-radio-two-acme-platform" class="sk-radio-choice-group__control" type="radio" name="workspace_two" value="acme-platform" required><span class="sk-radio-choice-group__label">Acme / Platform</span><span class="sk-radio-choice-group__secondary-value">acme/platform</span></label>
  </div>
</fieldset>
