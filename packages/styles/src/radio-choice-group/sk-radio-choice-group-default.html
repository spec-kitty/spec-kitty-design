<!-- @spec-kitty/styles — native radio choice group with several choices, one selected (#336) -->
<fieldset class="sk-radio-choice-group">
  <legend class="sk-radio-choice-group__legend">Connect a workspace</legend>
  <div class="sk-radio-choice-group__options">
    <label class="sk-radio-choice-group__choice" for="sk-radio-workspace-acme"><input id="sk-radio-workspace-acme" class="sk-radio-choice-group__control" type="radio" name="workspace" value="acme" checked><span class="sk-radio-choice-group__label">Acme</span><span class="sk-radio-choice-group__secondary-value">acme</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-workspace-acme-platform"><input id="sk-radio-workspace-acme-platform" class="sk-radio-choice-group__control" type="radio" name="workspace" value="acme-platform"><span class="sk-radio-choice-group__label">Acme / Platform</span><span class="sk-radio-choice-group__secondary-value">acme/platform</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-workspace-northwind"><input id="sk-radio-workspace-northwind" class="sk-radio-choice-group__control" type="radio" name="workspace" value="northwind"><span class="sk-radio-choice-group__label">Northwind</span><span class="sk-radio-choice-group__secondary-value">northwind</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-workspace-northwind-labs"><input id="sk-radio-workspace-northwind-labs" class="sk-radio-choice-group__control" type="radio" name="workspace" value="northwind-labs"><span class="sk-radio-choice-group__label">Northwind / Labs</span><span class="sk-radio-choice-group__secondary-value">northwind/labs</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-workspace-orbital"><input id="sk-radio-workspace-orbital" class="sk-radio-choice-group__control" type="radio" name="workspace" value="orbital"><span class="sk-radio-choice-group__label">Orbital</span></label>
  </div>
</fieldset>
