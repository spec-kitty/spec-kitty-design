<!-- @spec-kitty/styles — long legend, primary label, and opaque secondary machine value (#336) -->
<fieldset class="sk-radio-choice-group">
  <legend class="sk-radio-choice-group__legend">Choose the workspace that should receive every future connector installation from this project</legend>
  <div class="sk-radio-choice-group__options">
    <label class="sk-radio-choice-group__choice" for="sk-radio-long-acme"><input id="sk-radio-long-acme" class="sk-radio-choice-group__control" type="radio" name="workspace_long" value="acme-platform-engineering" checked><span class="sk-radio-choice-group__label">Acme / Platform Engineering / Shared Infrastructure Tooling</span><span class="sk-radio-choice-group__secondary-value">acme/platform-engineering/shared-infrastructure-tooling</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-long-northwind"><input id="sk-radio-long-northwind" class="sk-radio-choice-group__control" type="radio" name="workspace_long" value="northwind-data-platform-research"><span class="sk-radio-choice-group__label">Northwind / Data Platform / Research and Applied Modelling</span><span class="sk-radio-choice-group__secondary-value">northwind/data-platform/research-and-applied-modelling</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-long-orbital"><input id="sk-radio-long-orbital" class="sk-radio-choice-group__control" type="radio" name="workspace_long" value="orbital"><span class="sk-radio-choice-group__label">Orbital</span></label>
  </div>
</fieldset>
