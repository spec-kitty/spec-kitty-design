<!-- @spec-kitty/styles — native radio choice group with nothing checked, not required (#336) -->
<fieldset class="sk-radio-choice-group">
  <legend class="sk-radio-choice-group__legend">Choose a delivery region</legend>
  <div class="sk-radio-choice-group__options">
    <label class="sk-radio-choice-group__choice" for="sk-radio-region-us-east"><input id="sk-radio-region-us-east" class="sk-radio-choice-group__control" type="radio" name="region" value="us-east"><span class="sk-radio-choice-group__label">US East</span><span class="sk-radio-choice-group__secondary-value">us-east-1</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-region-eu-west"><input id="sk-radio-region-eu-west" class="sk-radio-choice-group__control" type="radio" name="region" value="eu-west"><span class="sk-radio-choice-group__label">EU West</span><span class="sk-radio-choice-group__secondary-value">eu-west-1</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-region-local"><input id="sk-radio-region-local" class="sk-radio-choice-group__control" type="radio" name="region" value="local"><span class="sk-radio-choice-group__label">Local only</span></label>
  </div>
</fieldset>
