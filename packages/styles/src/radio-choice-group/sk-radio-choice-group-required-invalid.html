<!-- @spec-kitty/styles — every radio required, nothing checked: a valid, honest invalid state (#336) -->
<fieldset class="sk-radio-choice-group">
  <legend class="sk-radio-choice-group__legend">Connect a workspace</legend>
  <div class="sk-radio-choice-group__options">
    <label class="sk-radio-choice-group__choice" for="sk-radio-required-acme"><input id="sk-radio-required-acme" class="sk-radio-choice-group__control" type="radio" name="workspace_required" value="acme" required><span class="sk-radio-choice-group__label">Acme</span><span class="sk-radio-choice-group__secondary-value">acme</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-required-acme-platform"><input id="sk-radio-required-acme-platform" class="sk-radio-choice-group__control" type="radio" name="workspace_required" value="acme-platform" required><span class="sk-radio-choice-group__label">Acme / Platform</span><span class="sk-radio-choice-group__secondary-value">acme/platform</span></label>
    <label class="sk-radio-choice-group__choice" for="sk-radio-required-northwind"><input id="sk-radio-required-northwind" class="sk-radio-choice-group__control" type="radio" name="workspace_required" value="northwind" required><span class="sk-radio-choice-group__label">Northwind</span><span class="sk-radio-choice-group__secondary-value">northwind</span></label>
  </div>
</fieldset>
