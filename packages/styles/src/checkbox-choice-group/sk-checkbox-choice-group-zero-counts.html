<!-- @spec-kitty/styles — zero metadata remains ordinary text, not state (#277) -->
<fieldset class="sk-checkbox-choice-group">
  <legend class="sk-checkbox-choice-group__legend">Available reports</legend>
  <div class="sk-checkbox-choice-group__options">
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-report-daily"><input id="sk-choice-report-daily" class="sk-checkbox-choice-group__control" type="checkbox" name="report" value="daily" checked><span class="sk-checkbox-choice-group__label">Daily summary</span><span class="sk-checkbox-choice-group__metadata">0</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-report-weekly"><input id="sk-choice-report-weekly" class="sk-checkbox-choice-group__control" type="checkbox" name="report" value="weekly"><span class="sk-checkbox-choice-group__label">Weekly summary</span><span class="sk-checkbox-choice-group__metadata">0</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-report-monthly"><input id="sk-choice-report-monthly" class="sk-checkbox-choice-group__control" type="checkbox" name="report" value="monthly"><span class="sk-checkbox-choice-group__label">Monthly summary</span><span class="sk-checkbox-choice-group__metadata">0</span></label>
  </div>
</fieldset>
