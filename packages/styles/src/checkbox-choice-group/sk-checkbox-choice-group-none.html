<!-- @spec-kitty/styles — native checkbox choice group with no selected choices (#277) -->
<fieldset class="sk-checkbox-choice-group">
  <legend class="sk-checkbox-choice-group__legend">Notification topics</legend>
  <div class="sk-checkbox-choice-group__options">
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-topic-releases"><input id="sk-choice-topic-releases" class="sk-checkbox-choice-group__control" type="checkbox" name="topic" value="releases"><span class="sk-checkbox-choice-group__label">Releases</span><span class="sk-checkbox-choice-group__metadata">6</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-topic-incidents"><input id="sk-choice-topic-incidents" class="sk-checkbox-choice-group__control" type="checkbox" name="topic" value="incidents"><span class="sk-checkbox-choice-group__label">Incidents</span><span class="sk-checkbox-choice-group__metadata">3</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-topic-maintenance"><input id="sk-choice-topic-maintenance" class="sk-checkbox-choice-group__control" type="checkbox" name="topic" value="maintenance"><span class="sk-checkbox-choice-group__label">Maintenance</span><span class="sk-checkbox-choice-group__metadata">2</span></label>
  </div>
</fieldset>
