<!-- @spec-kitty/styles — long native checkbox choice group content (#277) -->
<fieldset class="sk-checkbox-choice-group">
  <legend class="sk-checkbox-choice-group__legend">Choose every notification category that should remain visible while reviewing a particularly long operational report</legend>
  <div class="sk-checkbox-choice-group__options">
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-notification-dependency"><input id="sk-choice-notification-dependency" class="sk-checkbox-choice-group__control" type="checkbox" name="notification" value="dependency" checked><span class="sk-checkbox-choice-group__label">Dependency changes awaiting an independently verified compatibility assessment</span><span class="sk-checkbox-choice-group__metadata">Twelve recently observed entries with supporting evidence</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-notification-security"><input id="sk-choice-notification-security" class="sk-checkbox-choice-group__control" type="checkbox" name="notification" value="security"><span class="sk-checkbox-choice-group__label">Security advisories with unusually long package and remediation descriptions</span><span class="sk-checkbox-choice-group__metadata">No matching entries in the current consumer-owned snapshot</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-notification-release"><input id="sk-choice-notification-release" class="sk-checkbox-choice-group__control" type="checkbox" name="notification" value="release"><span class="sk-checkbox-choice-group__label">Release announcements</span></label>
  </div>
</fieldset>
