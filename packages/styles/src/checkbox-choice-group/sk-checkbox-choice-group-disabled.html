<!-- @spec-kitty/styles — native disabled and checked-disabled choices (#277) -->
<fieldset class="sk-checkbox-choice-group">
  <legend class="sk-checkbox-choice-group__legend">Delivery channels</legend>
  <div class="sk-checkbox-choice-group__options">
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-channel-email"><input id="sk-choice-channel-email" class="sk-checkbox-choice-group__control" type="checkbox" name="channel" value="email" checked><span class="sk-checkbox-choice-group__label">Email</span><span class="sk-checkbox-choice-group__metadata">Ready</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-channel-chat"><input id="sk-choice-channel-chat" class="sk-checkbox-choice-group__control" type="checkbox" name="channel" value="chat" disabled><span class="sk-checkbox-choice-group__label">Team chat</span><span class="sk-checkbox-choice-group__metadata">Unavailable</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-channel-digest"><input id="sk-choice-channel-digest" class="sk-checkbox-choice-group__control" type="checkbox" name="channel" value="digest" checked disabled><span class="sk-checkbox-choice-group__label">Weekly digest</span><span class="sk-checkbox-choice-group__metadata">Locked</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-channel-mobile"><input id="sk-choice-channel-mobile" class="sk-checkbox-choice-group__control" type="checkbox" name="channel" value="mobile"><span class="sk-checkbox-choice-group__label">Mobile alert</span></label>
  </div>
</fieldset>
