<!-- @spec-kitty/styles — native checkbox choice group with several selected choices (#277) -->
<fieldset class="sk-checkbox-choice-group">
  <legend class="sk-checkbox-choice-group__legend">Detailed lanes</legend>
  <div class="sk-checkbox-choice-group__options">
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-genesis"><input id="sk-choice-lane-genesis" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="genesis"><span class="sk-checkbox-choice-group__label">Genesis</span><span class="sk-checkbox-choice-group__metadata">0</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-planned"><input id="sk-choice-lane-planned" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="planned"><span class="sk-checkbox-choice-group__label">Planned</span><span class="sk-checkbox-choice-group__metadata">2</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-claimed"><input id="sk-choice-lane-claimed" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="claimed"><span class="sk-checkbox-choice-group__label">Claimed</span><span class="sk-checkbox-choice-group__metadata">1</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-in-progress"><input id="sk-choice-lane-in-progress" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="in_progress"><span class="sk-checkbox-choice-group__label">In progress</span><span class="sk-checkbox-choice-group__metadata">3</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-for-review"><input id="sk-choice-lane-for-review" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="for_review"><span class="sk-checkbox-choice-group__label">For review</span><span class="sk-checkbox-choice-group__metadata">2</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-in-review"><input id="sk-choice-lane-in-review" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="in_review" checked><span class="sk-checkbox-choice-group__label">In review</span><span class="sk-checkbox-choice-group__metadata">1</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-approved"><input id="sk-choice-lane-approved" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="approved"><span class="sk-checkbox-choice-group__label">Approved</span><span class="sk-checkbox-choice-group__metadata">1</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-done"><input id="sk-choice-lane-done" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="done"><span class="sk-checkbox-choice-group__label">Done</span><span class="sk-checkbox-choice-group__metadata">4</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-blocked"><input id="sk-choice-lane-blocked" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="blocked" checked><span class="sk-checkbox-choice-group__label">Blocked</span><span class="sk-checkbox-choice-group__metadata">1</span></label>
    <label class="sk-checkbox-choice-group__choice" for="sk-choice-lane-canceled"><input id="sk-choice-lane-canceled" class="sk-checkbox-choice-group__control" type="checkbox" name="lane" value="canceled"><span class="sk-checkbox-choice-group__label">Canceled</span><span class="sk-checkbox-choice-group__metadata">0</span></label>
  </div>
</fieldset>
