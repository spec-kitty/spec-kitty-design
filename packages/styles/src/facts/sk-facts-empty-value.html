<!-- @spec-kitty/styles — sk-facts (empty value, proving the layout doesn't break and nothing is invented) -->
<!-- Targets --two-col: an empty grid cell in the `max-content 1fr` layout is the one
     place a collapsed value could visibly break row alignment; the stacked default has
     nothing for an empty value to misalign against. -->
<dl class="sk-facts sk-facts--two-col">
  <dt class="sk-facts__term">Status</dt>
  <dd class="sk-facts__value">Running</dd>
  <dt class="sk-facts__term">Notes</dt>
  <dd class="sk-facts__value"></dd>
</dl>
