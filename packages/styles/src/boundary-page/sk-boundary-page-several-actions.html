<!-- @spec-kitty/styles — sk-boundary-page (action-group with several actions) -->
<!-- Exercises wrap at narrow width without breaking the 44px target-size floor (spec FR-013,
     Edge Cases). -->
<main>
  <div class="sk-boundary-page sk-boundary-page__stage">
    <div class="sk-boundary-page__card">
      <h1 class="sk-boundary-page__title">Capacity reached</h1>
      <p class="sk-boundary-page__body">
        This Team is at its member limit. Choose how you'd like to continue.
      </p>
      <div class="sk-boundary-page__action-group">
        <button type="button">Request a seat</button>
        <a href="#browse">Browse other Teams</a>
        <a href="#create">Create a new Team</a>
        <a href="#sign-in">Back to sign in</a>
      </div>
    </div>
  </div>
</main>
