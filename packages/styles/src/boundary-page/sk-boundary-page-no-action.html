<!-- @spec-kitty/styles — sk-boundary-page (action-group present but empty) -->
<!-- FR-007: the action-group container itself is never omitted, only its content count
     varies — a distinct, supported state from the mark/footnote's full-DOM-omission
     contract (spec FR-006), never collapsed into it. -->
<main>
  <div class="sk-boundary-page sk-boundary-page__stage">
    <div class="sk-boundary-page__card">
      <h1 class="sk-boundary-page__title">Link no longer valid</h1>
      <p class="sk-boundary-page__body">
        This join link has expired. Ask whoever shared it with you for a new one.
      </p>
      <div class="sk-boundary-page__action-group"></div>
    </div>
  </div>
</main>
