<!-- @spec-kitty/styles — sk-boundary-page (terminal card: no mark, message only, no footnote) -->
<!-- Deliberately exercises "no mark" and "no footnote" together in one exemplar (spec FR-006,
     FR-007) — the identical anatomy as the form card, differing only in consumer-authored
     content, per research.md Decision 3 (no card-shape modifier). -->
<main>
  <div class="sk-boundary-page sk-boundary-page__stage">
    <div class="sk-boundary-page__card">
      <h1 class="sk-boundary-page__title">
        Join-link resumed
        <sk-pill-tag class="sk-pill-tag--status-success">Resumed</sk-pill-tag>
      </h1>
      <p class="sk-boundary-page__body">
        Your session picked up right where you left off. There's nothing else to do here.
      </p>
      <div class="sk-boundary-page__action-group">
        <a href="#continue">Continue to your workspace</a>
      </div>
    </div>
  </div>
</main>
