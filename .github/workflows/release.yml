name: Publish Release

on:
  push:
    tags: ['v*.*.*']

# RETARGETED TO GITHUB PACKAGES (operator decision, REL2 review). This workflow pointed at
# npmjs.org, and REL2 added `publishConfig.registry` to all four manifests — which OUTRANKS the
# npmrc that `setup-node`'s `registry-url` writes. The result would have been a prod release that
# sends tarballs to GitHub Packages while holding credentials for npmjs: an auth failure on the
# next tag, introduced by a PR that never touched this file. Review measured it; the operator chose
# to make prod consistent with the standing GitHub-Packages-only ruling rather than defer.
#
# Three consequences, all deliberate:
#   `packages: write`  is now required — without it GITHUB_TOKEN cannot publish here at all, and
#                      this workflow did not have it, so it would have 403'd even after the
#                      registry change.
#   `--provenance`     is gone: npm provenance is an npmjs.org MECHANISM, unsupported on GitHub
#                      Packages. FR-044 is met instead by `actions/attest-build-provenance` over the
#                      packed tarballs (REL3, #364, per the 2026-09-11 amendment on #361), which is
#                      why `id-token: write` and `attestations: write` are declared below.
#   `NPM_TOKEN`        never existed as a secret (verified: zero secrets by that name), so prod
#                      could not publish to npmjs today regardless. GITHUB_TOKEN is a credential
#                      that actually exists.
permissions:
  contents: write   # for GitHub Release creation
  packages: write   # to publish to GitHub Packages — load-bearing, and absent before this change
  id-token: write      # REL3 (#364): Sigstore signing for the tarball attestations
  attestations: write  # REL3 (#364): store the attestations on this repo

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # THE REGISTRY TOKEN IS STEP-SCOPED, NOT JOB-WIDE (REL3 review). `id-token: write` makes every step
    # in this job able to mint an OIDC token and so sign an attestation; a job-wide NODE_AUTH_TOKEN and
    # checkout's persisted credentials widened what any one step could do on top. So: the token goes
    # only to the steps that talk to the registry, checkout does not persist credentials, and the SBOM
    # tool runs from the lockfile (`npx --no-install`) instead of being fetched unpinned at release time.
    # What remains is inherent to attesting in the building job (SLSA Build L2): the attestation proves
    # these bytes came from this workflow on a GitHub-hosted runner, not that no step in it misbehaved.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci --ignore-scripts

      - name: "[ENFORCED] Security gate before publish (ADR-005)"
        run: bash scripts/npm-audit-gate.sh

      # DERIVED, not listed. This step read a hand-written `--projects=` list while the publish
      # steps below named two packages and the contents audit looped over the same two — three
      # hand-written lists that had already drifted apart. `elements` was built here on every
      # release and then never published; `react` appeared in none of the three. Nothing could see
      # it, because this workflow runs only on a v*.*.* tag and no PR has ever executed it.
      # scripts/release-graph.mjs is now the single source, and it refuses an empty set.
      #
      # `--projects` is NOT the same list as `--dirs`: @spec-kitty/react is publishable but has no
      # `build` target (it ships the generated wrappers as committed source, gated by
      # build-react-wrappers.mjs --check on every PR). The script derives both facets from one scan
      # rather than leaving the difference to be remembered.
      # CAPTURED INTO VARIABLES AND ASSERTED, NOT INTERPOLATED INTO `echo`.
      #
      # The first draft was `echo "projects=$(node scripts/release-graph.mjs --projects)"`, and
      # that voided the whole fail-closed design at the shell boundary. `set -e` does NOT
      # propagate a failed command substitution when the enclosing command is `echo` — measured:
      # the substitution fails, `projects=` is written empty, and the step exits 0. Downstream,
      # `nx run-many --projects=` treats an empty filter as ALL projects, and `for pkg in ; do`
      # iterates zero times and succeeds. The release would then run green to completion, create
      # the GitHub Release, and publish NOTHING — the exact green-over-an-empty-set shape this
      # mission exists to end, one layer above where the refusal was written.
      #
      # A bare assignment DOES trip `set -e`, so the assignments below fail the step. The
      # explicit emptiness tests are belt and braces: they cost nothing and they are what a
      # reader can see.
      - name: Resolve the publishable package set
        id: graph
        run: |
          set -euo pipefail
          PROJECTS="$(node scripts/release-graph.mjs --projects)"
          DIRS="$(node scripts/release-graph.mjs --dirs)"
          [ -n "$PROJECTS" ] || { echo "::error::empty build set"; exit 1; }
          [ -n "$DIRS" ]     || { echo "::error::empty publish set"; exit 1; }
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $DIRS"


      - name: Build all packages
        run: npx --no-install nx run-many --target=build --projects=${{ steps.graph.outputs.projects }}

      # The `cp sk-nav-pill.js` step that stood here is gone with the helper (#73). It existed
      # only because @nx/js:tsc copies **/*.{html,css} assets and not .js, and @spec-kitty/styles
      # no longer ships any .js at all. Note this workflow runs ONLY on a v*.*.* tag, so no PR
      # check exercises it: the step would have hard-failed the next release before either
      # `npm publish`, and a pre-merge lens found it by reading rather than by running.
      # This step PRINTED for a human to read, under an [ENFORCED] label, and that is exactly
      # how @spec-kitty/styles shipped 28 sourcemaps: no human ever read it, because this
      # workflow had never run. The listing stays — it is useful in a release log — but the
      # assertion above it is what makes the label true.
      # THE ASSERTIONS RUN ON THE RELEASE PATH, not only at PR time. Two lenses found this
      # independently: every check this mission added lived in ci-quality.yml, which triggers on
      # pull_request and on push to [main, train/**] — and NOT on tags. So a tag placed on any
      # commit that had not been through that workflow got no contents audit, no exports check
      # and no SRI verification, while the audit step below still wore an [ENFORCED] label.
      #
      # AFTER the build, not before: both read packages/*/dist, which is gitignored.
      # The blindness check runs HERE too, by this file's own argument: a tag can sit on a commit
      # ci-quality.yml never saw, so a gate that only self-tests at PR time is a gate that has not
      # self-tested on the path that publishes.
      - name: "[ENFORCED] The release gate can see its own failures (SC-003)"
        run: node scripts/check-release-graph.mjs --selftest
      - name: "[ENFORCED] Release graph is coherent (FR-003, FR-004)"
        run: node scripts/check-release-graph.mjs
      - name: "[ENFORCED] Packed Vue declarations compile without workspace paths (#149)"
        run: node scripts/check-vue-packed-types.mjs
      - name: "[ENFORCED] Sizes and the SRI hash match the built artifacts (FR-005, NFR-004)"
        run: node scripts/measure-elements-sizes.mjs --check
      # REL4 (#396). The prod stream publishes the committed version, so there is no bump here; the
      # check refuses a tag whose committed OpenDesign package has drifted from the library.
      - name: "[ENFORCED] OpenDesign package is current with the library (#396, FR-011)"
        run: node scripts/build-opendesign-package.mjs --check
      - name: "[ENFORCED] Dist contents audit — no secrets/sourcemaps (ADR-005)"
        run: |
          set -euo pipefail
          # Each consuming loop asserts its OWN input. The floor in the producing step is not
          # enough: `steps.graph.outputs.dirs` on a deleted or renamed step id resolves to the
          # empty string, and `for pkg in ; do` iterates zero times and exits 0.
          PKGS="${{ steps.graph.outputs.dirs }}"
          [ -n "$PKGS" ] || { echo "::error::empty publish set reached the audit loop"; exit 1; }
          for pkg in $PKGS; do
            echo "=== packages/$pkg ==="
            ( cd "packages/$pkg" && npm pack --dry-run 2>&1 | grep "npm notice" | grep -v "===" )
          done

      - name: Generate CycloneDX SBOM (FR-045)
        run: |
          npx --no-install @cyclonedx/cyclonedx-npm \
            --output-format json \
            --output-file spec-kitty-design-sbom.cdx.json
          echo "SBOM components: $(node -e "const d=require('./spec-kitty-design-sbom.cdx.json'); console.log(d.components.length)")"

      # REL3 (#364): PACK, ATTEST, PUBLISH THOSE FILES, VERIFY — the same order and the same shared
      # scripts as the rc payload. `--provenance` stays gone (it is the npmjs mechanism and hard-fails
      # on GitHub Packages); FR-044 is met by these attestations over the exact published bytes.
      - name: "[ENFORCED] Pack the derived set into the tarballs that get attested and published"
        run: node scripts/pack-derived-set.mjs

      - name: "[ENFORCED] Attest the packed tarballs (#364, FR-044)"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # actions/attest-build-provenance v4.2.2
        with:
          subject-path: 'dist-tarballs/*.tgz'

      # ONE step over the derived set, not one hand-written step per package. Two steps named
      # `tokens` and `styles` are how `elements` and `react` came to be absent without anyone
      # noticing: adding a package to the repo did not add it here, and nothing compared the two.
      #
      # `set -euo pipefail` is load-bearing. Without it a failing `npm publish` inside a `for` loop
      # does not fail the step, and the workflow would report a successful release having published
      # a subset — the same silent-partial-success this whole rewrite is about.
      # RESUMABLE, AND IT ACCUMULATES. `set -e` with a bare loop aborts on the first failure,
      # which is not a recovery strategy — npm has no atomic multi-package publish, so a failure
      # part-way leaves earlier packages on the registry permanently. Re-running then aborted on
      # the FIRST package, which is the already-published one, so the packages that actually
      # failed were never retried and the release stayed wedged at that version. A lens walked
      # through it.
      #
      # So an already-published version is a SKIP, not a failure. A re-run re-packs the same commit;
      # on a GitHub-hosted runner (fixed checkout path, deterministic npm pack) that reproduces the
      # same bytes, so the retry verifies what is already on the registry. If a toolchain change made
      # the bytes differ, verify fails and that version cannot be completed — see the runbook.
      #
      # `set -euo pipefail` is RESTORED here. An earlier revision dropped `-e` on the stated
      # grounds that it "would defeat the handling" — that is false, and a lens measured it: POSIX
      # exempts the condition of an `if` from `set -e`, and both handled commands are if-conditions.
      # Dropping `-e` therefore bought nothing and silently removed protection from every
      # *unhandled* command in the block.
      - name: Publish every package in the derived set
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # THE ATTESTED FILES, NEVER A PACKAGE DIRECTORY. `--list` re-validates dist-tarballs/ against
          # the derived set (names, versions, order, every file's hash, no stray tarball) and prints one
          # path per line in topological order. A directory publish would repack in memory and upload
          # bytes the attestation never saw.
          FILES="$(node scripts/pack-derived-set.mjs --list)"
          [ -n "$FILES" ] || { echo "::error::empty publish set reached the publish loop"; exit 1; }
          failed=""
          for file in $FILES; do
            pkg="$(basename "$file" .tgz)"
            echo "=== publishing $pkg from dist-tarballs/ ==="
            # `--access public` stays gone: an npmjs access model; GitHub Packages governs visibility
            # per package outside the publish call. This loop is not routed through
            # scripts/publish-derived-set.mjs: that script refuses `latest` unconditionally (REL2), and
            # this is the prod stream, which owns `latest`.
            # `--tag latest` EXPLICITLY. Without it a `publishConfig.tag` would choose the channel; with it
            # the flag wins over `publishConfig.tag` (npm drops publishConfig keys given on the CLI), but
            # a top-level manifest `tag` still wins over the flag (libnpmpublish: `manifest.tag ||
            # defaultTag`) — which is why check-release-graph.mjs refuses both keys outright.
            if out="$( npm publish "$file" --tag latest 2>&1 )"; then
              echo "$out"
            else
              echo "$out"
              # ANCHORED ON THE ERROR CODE. Matching prose ("previously published", "cannot publish
              # over") means any error whose body happens to quote those words is swallowed as a
              # skip — a lens built a synthetic 403 that did exactly that. npm prints a stable
              # `npm error code EPUBLISHCONFLICT` line; that is the signal.
              if echo "$out" | grep -qE "code (EPUBLISHCONFLICT|E409)"; then
                # A conflict on a RETRY is resumption. A conflict on the first attempt means the
                # name+version is on the registry and this workflow did not put it there — these
                # names have never been published, so that is someone else's package, not ours.
                # Warning, not notice, and never on attempt 1.
                if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
                  echo "::warning::$pkg is already published at this version — skipping (run attempt ${GITHUB_RUN_ATTEMPT})"
                else
                  echo "::error::$pkg reports an existing version on the FIRST attempt."
                  echo "A first-attempt conflict means this version is already on the registry and this run did not put it there."
                  echo "Verify ownership before re-running: npm view <name>@<version> _npmUser.name"
                  failed="$failed $pkg"
                  break
                fi
              else
                # HALT, do not accumulate. The set is published in TOPOLOGICAL order precisely so a
                # package goes out after everything it depends on. Continuing past a real failure
                # spends that guarantee in the only path it was for: if `tokens` fails, `styles`,
                # `elements` and `react` publish anyway, `npm publish` does not resolve peers so all
                # three succeed, and every consumer install then hard-fails E404 on the peer that is
                # missing. Those versions are permanent — a version cannot be republished and the
                # unpublish window is 72h and conditional.
                #
                # A lens caught this: the resumability of this loop comes entirely from the
                # skip-on-conflict branch above, not from continuing past real failures. Halting
                # loses nothing, because the retry resumes from here.
                echo "::error::halting — every package after $pkg in the derived set may depend on it"
                failed="$failed $pkg"
                break
              fi
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::failed to publish:$failed"
            echo "Packages published before the failure remain on the registry; npm has no atomic"
            echo "multi-package publish. Fix the cause and re-run this tag — already-published"
            echo "packages are skipped, so the retry completes the set."
            exit 1
          fi

      - name: "[ENFORCED] The registry holds exactly the attested bytes (#364)"
        run: node scripts/verify-published-integrity.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh attestation verify` reads the attestations API; each downloaded tarball must carry
          # an attestation from this repo, not merely match packed.json (which is not attested).
          GH_TOKEN: ${{ github.token }}
          # Pin WHICH workflow, on WHICH commit, signed: `--repo` alone accepts any workflow on any ref.
          SIGNER_WORKFLOW: spec-kitty/spec-kitty-design/.github/workflows/release.yml
          SOURCE_DIGEST: ${{ github.sha }}

      # SAME REASONING AS THE RC PAYLOAD, and it applies here now that prod publishes to GitHub
      # Packages too: `npm view` returns exit 0 with zero bytes against this registry, so a report
      # built on it is blind and green. `npm dist-tag ls` works, and an empty read is a FAILED read.
      - name: "[ENFORCED] Report the published dist-tags"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FAILED=""
          # A GREEN LINE OVER ZERO PACKAGES IS THE FOUNDING DEFECT OF THIS GATE FAMILY. With `dirs`
          # empty the loop iterated zero times and the step exited 0, reporting a confirmed publish
          # having confirmed nothing.
          REPORT_PKGS="${{ steps.graph.outputs.dirs }}"
          [ -n "$REPORT_PKGS" ] || { echo "::error::empty publish set reached the dist-tag report"; exit 1; }
          for pkg in $REPORT_PKGS; do
            NAME="$(node -p "require('./packages/$pkg/package.json').name")"
            echo "=== $NAME ==="
            # STATUS ON ITS OWN LINE, and stderr kept OUT of the success test. The first version
            # wrote `OUT="$(npm dist-tag ls "$NAME" 2>&1)" || true`, folding an E404/E401 body INTO
            # $OUT — so an auth failure sailed through the emptiness check as a non-empty "reading"
            # and `|| true` discarded the status. Same blind-and-green shape this step was written
            # to fix, one layer in.
            set +e
            OUT="$(npm dist-tag ls "$NAME" 2>/tmp/disttag.err)"
            RC=$?
            set -e
            printf '%s\n' "$OUT"
            if [ "$RC" -ne 0 ]; then
              echo "::error::$NAME: npm dist-tag ls exited $RC"
              sed 's/^/    /' /tmp/disttag.err
              FAILED="$FAILED $NAME"
            elif [ -z "$(printf '%s' "$OUT" | tr -d '[:space:]')" ]; then
              echo "::error::$NAME returned an empty dist-tag listing — a failed read, not an absent tag"
              FAILED="$FAILED $NAME"
            fi
          done
          [ -z "$FAILED" ] || { echo "::error::could not confirm dist-tags for:$FAILED"; exit 1; }

      - name: Create GitHub Release with SBOM
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # softprops/action-gh-release v3.0.0
        with:
          files: spec-kitty-design-sbom.cdx.json
          generate_release_notes: true
