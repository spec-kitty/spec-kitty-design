name: CI Quality

on:
  # `train/**` is the elements-first integration line (ADR-8). Mission branches
  # PR into the train, and the train lands on main once. Without the train in
  # these filters those PRs would run no quality gate at all — the checks are
  # branch-filtered, not universal, so a long-lived integration branch has to
  # be named explicitly or it merges unchecked.
  pull_request:
    branches: [main, 'train/**']
  push:
    branches: [main, 'train/**']
  schedule:
    # FR-041: nightly CVE audit on main branch
    # Offset from top of hour to avoid busy scheduling window (matches SK pattern)
    - cron: '17 2 * * *'

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # needed for lint-feedback job

jobs:
  # ── Path filter ──────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      tokens:     ${{ steps.filter.outputs.tokens }}
      components: ${{ steps.filter.outputs.components }}
      docs:       ${{ steps.filter.outputs.docs }}
      ci:         ${{ steps.filter.outputs.ci }}
      doctrine:   ${{ steps.filter.outputs.doctrine }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # dorny/paths-filter v4.0.1
        id: filter
        with:
          filters: |
            tokens:
              - 'packages/tokens/**'
            components:
              - 'tsconfig.base.json'
              - 'packages/styles/**'
              - 'apps/storybook/**'
              # The demo pages are part of this surface: storybook-build is what
              # runs assemble-demo-dist.sh, so a PR editing a demo asset path
              # must not skip it.
              - 'apps/demo/**'
              # The gates' own runners live here. Without this,
              # run-axe-storybook.js could be edited without the a11y gate
              # running — which is exactly how four defects reached the train
              # unnoticed, and why that gate had never run green (#90). It also
              # covers assemble-demo-dist.sh, which storybook-build runs.
              - 'scripts/**'
              # And this file, which wires those gates together. Adding
              # scripts/** without it left the sibling hole open: a PR editing
              # the gate definitions themselves ran no storybook gate at all
              # (#94).
              - '.github/workflows/ci-quality.yml'
              # ...and the config those gates run on. scripts/** covered the
              # runners and ci-quality.yml the wiring; these drive the jobs
              # themselves, and an edit to any of them was invisible (#94).
              - 'playwright.config.ts'
              - 'nx.json'
              - 'package.json'
              - 'package-lock.json'
            docs:
              - 'docs/**'
              - '*.md'
            ci:
              - '.github/workflows/**'
              - 'scripts/**'
            doctrine:
              - 'doctrine/**'
              - 'skills/**'

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - name: "[ENFORCED] npm audit — high/critical gate (FR-041)"
        run: bash scripts/npm-audit-gate.sh
      - name: "[ENFORCED] Lockfile integrity check (FR-042)"
        run: npm ci --dry-run --ignore-scripts

  # ── Workflow pin check ───────────────────────────────────────────────────────
  workflow-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - name: "[ENFORCED] Check all Actions are SHA-pinned (FR-043)"
        run: bash scripts/check-action-pins.sh

  # ── Code lint ────────────────────────────────────────────────────────────────
  lint-code:
    runs-on: ubuntu-latest
    outputs:
      eslint_failures: ${{ steps.eslint.outputs.has_failures }}
      stylelint_failures: ${{ steps.stylelint.outputs.has_failures }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - name: Compute nx affected
        run: |
          echo "NX_BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}" >> $GITHUB_ENV
          echo "NX_HEAD=${{ github.sha }}" >> $GITHUB_ENV
      - name: "[ENFORCED] ESLint (FR-018)"
        id: eslint
        continue-on-error: true
        run: |
          if npx nx affected --target=lint --base="$NX_BASE" --head="$NX_HEAD" 2>&1 | tee /tmp/eslint-out.txt; then
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "[ENFORCED] Stylelint (FR-017)"
        id: stylelint
        continue-on-error: true
        run: |
          if npm run quality:stylelint 2>&1 | tee /tmp/stylelint-out.txt; then
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "[ENFORCED] HTMLHint (FR-019)"
        run: npm run quality:htmlhint
      - name: "[ENFORCED] commitlint (FR-020)"
        if: github.event_name == 'pull_request'
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }}
      - name: "[ENFORCED] Fail if lint errors"
        if: always()
        run: |
          if [ "${{ steps.eslint.outputs.has_failures }}" = "true" ] || \
             [ "${{ steps.stylelint.outputs.has_failures }}" = "true" ]; then
            echo "Lint failures detected. See job summary."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact v4.6.2
        if: always()
        with:
          name: lint-reports
          path: /tmp/*-out.txt
          if-no-files-found: ignore

  # ── Storybook build ──────────────────────────────────────────────────────────
  storybook-build:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.tokens == 'true' || needs.changes.outputs.components == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - name: "[ENFORCED] Storybook build (NFR-003 < 3 min)"
        run: npx nx run storybook:storybook:build
      # Runs before the upload so the artifact the downstream jobs consume matches
      # what the deploy actually publishes — the demo pages included. That is what
      # lets nav-pill-behaviour.spec.ts drive the package's runtime JS through the
      # real consumer path. It also runs the same script the deploy runs, so the sed
      # rewrite, the asset mirroring and the reference-resolution check are exercised
      # on every PR instead of only on push to main.
      - name: "[ENFORCED] Demo surface assembles and every asset reference resolves"
        run: |
          npx nx run-many --target=build --projects=tokens
          bash scripts/assemble-demo-dist.sh apps/storybook/storybook-static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact v4.6.2
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
          retention-days: 3

  # ── Accessibility gate ────────────────────────────────────────────────────
  a11y:
    runs-on: ubuntu-latest
    needs: [storybook-build]
    if: needs.storybook-build.result == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with: { name: storybook-static, path: apps/storybook/storybook-static }
      - name: "[ENFORCED] axe WCAG 2.1 AA gate (FR-021)"
        run: npx playwright install chromium && node scripts/run-axe-storybook.js

  # ── Visual regression ──────────────────────────────────────────────────────
  visual-regression:
    runs-on: ubuntu-latest
    needs: [storybook-build]
    if: needs.storybook-build.result == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with: { name: storybook-static, path: apps/storybook/storybook-static }
      # playwright.config.ts runs chromium/firefox/webkit projects, but
      # visual baselines exist for chromium only (7 snapshots) — firefox/
      # webkit baselines were never generated, so VR could never pass
      # anywhere. Enforced VR gate runs chromium-only for now; cross-browser
      # smoke still exercises all three browsers. Baseline refresh across
      # the matrix is filed as follow-up work.
      - run: npx playwright install --with-deps
      - name: "[ENFORCED] Visual regression (FR-024)"
        run: npx playwright test apps/storybook/src/tests/visual.spec.ts --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact v4.6.2
        if: failure()
        with:
          name: visual-regression-diffs
          path: playwright-report/

  # ── Cross-browser smoke ────────────────────────────────────────────────────
  playwright:
    runs-on: ubuntu-latest
    needs: [storybook-build]
    if: needs.storybook-build.result == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with: { name: storybook-static, path: apps/storybook/storybook-static }
      - run: npx playwright install --with-deps
      - name: "[ENFORCED] Cross-browser smoke (FR-023)"
        run: npx playwright test apps/storybook/src/tests/smoke.spec.ts
      # sk-nav-pill.js is the only executable code in @spec-kitty/styles and had no
      # test until M2 (#68). It runs here rather than in visual-regression because
      # it asserts behaviour, not pixels, and because it drives the assembled demo
      # page — the real no-build consumer path from the ADR-12 audit.
      - name: "[ENFORCED] Styles runtime behaviour — nav-pill drawer"
        run: npx playwright test apps/storybook/src/tests/nav-pill-behaviour.spec.ts

  # ── Lighthouse (advisory) ──────────────────────────────────────────────────
  lighthouse:
    runs-on: ubuntu-latest
    needs: [storybook-build]
    if: needs.storybook-build.result == 'success'
    continue-on-error: true   # advisory only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with: { name: storybook-static, path: apps/storybook/storybook-static }
      - name: Serve storybook-static for audit
        run: npx --yes http-server apps/storybook/storybook-static -p 6006 --silent &
      - name: "[INFO] Lighthouse audit (FR-022)"
        # @lhci/cli removed from devDeps: abandoned upstream with an
        # unpatchable transitive chain (image-size/extract-zip/puppeteer-core).
        # Plain lighthouse via npx keeps the advisory value without the vulns.
        run: |
          npx --yes lighthouse@latest http://localhost:6006 --quiet --chrome-flags="--headless" --output=json --output-path=lighthouse-report.json || true
          node -e "const r=require('./lighthouse-report.json'); for (const [k,v] of Object.entries(r.categories)) console.log(k+': '+Math.round(v.score*100))" || true

  # ── Merge gate ──────────────────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    needs: [changes, security, workflow-pin-check, lint-code, storybook-build, a11y, visual-regression, playwright]
    if: always()
    steps:
      - name: "[ENFORCED] All hard gates must pass (FR-026)"
        run: |
          echo "changes: ${{ needs.changes.result }} (tokens=${{ needs.changes.outputs.tokens }} components=${{ needs.changes.outputs.components }})"
          echo "security: ${{ needs.security.result }}"
          echo "workflow-pin-check: ${{ needs.workflow-pin-check.result }}"
          echo "lint-code: ${{ needs.lint-code.result }}"
          echo "storybook-build: ${{ needs.storybook-build.result }}"
          echo "a11y: ${{ needs.a11y.result }}"
          echo "visual-regression: ${{ needs.visual-regression.result }}"
          echo "playwright: ${{ needs.playwright.result }}"
          # a11y / visual-regression / playwright are skipped when storybook-build is skipped (no component changes)
          # storybook-build carries [ENFORCED] steps of its own (the Storybook
          # build and the demo-surface assembly check). Until it was added to
          # needs, a failure there skipped a11y / visual-regression / playwright,
          # and 'skipped' is accepted below - so those enforced steps could not
          # block a merge. It is legitimately skipped when no component changed.
          #
          # `changes` is tested STRICTLY (never 'skipped') because every other
          # gate hangs off its outputs. If it fails, storybook-build skips for
          # unmet needs, the three downstream jobs skip on their result guards,
          # and all four are then accepted below - the same green-by-skip shape,
          # one level up. It runs unconditionally, so 'skipped' is never
          # legitimate for it (#94).
          sb_ok="${{ needs.storybook-build.result }}"
          a11y_ok="${{ needs.a11y.result }}"
          vr_ok="${{ needs.visual-regression.result }}"
          pw_ok="${{ needs.playwright.result }}"
          # Treat 'skipped' as acceptable (no components changed, gates not applicable)
          if [ "$sb_ok"   != "success" ] && [ "$sb_ok"   != "skipped" ]; then sb_ok="fail"; fi
          if [ "$a11y_ok" != "success" ] && [ "$a11y_ok" != "skipped" ]; then a11y_ok="fail"; fi
          if [ "$vr_ok"   != "success" ] && [ "$vr_ok"   != "skipped" ]; then vr_ok="fail"; fi
          if [ "$pw_ok"   != "success" ] && [ "$pw_ok"   != "skipped" ]; then pw_ok="fail"; fi

          # 'skipped' is only acceptable for the REASON it exists: nothing
          # relevant changed. Accepting it unconditionally was the same
          # green-by-skip defect one level down - a PR editing this file could
          # set `if: false` on a11y, get 'skipped', and pass. The filter outputs
          # make the tolerance conditional on data rather than asserted in a
          # comment, and they are reachable here only because `changes` is now
          # in `needs` (#94).
          relevant="${{ needs.changes.outputs.tokens }}${{ needs.changes.outputs.components }}"
          case "$relevant" in
            *true*)
              if [ "$sb_ok"   = "skipped" ]; then sb_ok="fail";   echo "storybook-build skipped despite relevant changes"; fi
              if [ "$a11y_ok" = "skipped" ]; then a11y_ok="fail"; echo "a11y skipped despite relevant changes"; fi
              if [ "$vr_ok"   = "skipped" ]; then vr_ok="fail";   echo "visual-regression skipped despite relevant changes"; fi
              if [ "$pw_ok"   = "skipped" ]; then pw_ok="fail";   echo "playwright skipped despite relevant changes"; fi
              ;;
          esac
          if [ "${{ needs.changes.result }}"           != "success" ] || \
             [ "${{ needs.security.result }}"          != "success" ] || \
             [ "${{ needs.workflow-pin-check.result }}" != "success" ] || \
             [ "${{ needs.lint-code.result }}"          != "success" ] || \
             [ "$sb_ok"   = "fail" ] || \
             [ "$a11y_ok" = "fail" ] || \
             [ "$vr_ok"   = "fail" ] || \
             [ "$pw_ok"   = "fail" ]; then
            echo "One or more hard gates failed. Merge blocked."
            exit 1
          fi
          echo "All hard gates passed."

  # ── Lint feedback ────────────────────────────────────────────────────────────
  lint-feedback:
    runs-on: ubuntu-latest
    needs: lint-code
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.lint-code.outputs.eslint_failures == 'true' ||
      needs.lint-code.outputs.stylelint_failures == 'true')
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with: { name: lint-reports, path: /tmp/reports }
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # actions/github-script v7.1.0
        with:
          script: |
            const fs = require('fs');
            let body = '## Lint failures\n\n';
            for (const f of ['eslint-out.txt', 'stylelint-out.txt']) {
              const p = `/tmp/reports/${f}`;
              if (fs.existsSync(p)) body += `**${f}**\n\`\`\`\n${fs.readFileSync(p,'utf8').slice(0,2000)}\n\`\`\`\n\n`;
            }
            github.rest.issues.createComment({
              ...context.repo, issue_number: context.payload.pull_request.number, body
            });
