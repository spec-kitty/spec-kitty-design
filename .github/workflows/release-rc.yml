name: Publish rc

# REL2 (#363, epic #361). The rc half of the dual-stream pipeline — now a THIN CALLER.
#
# The publish payload lives in `publish-packages.yml`, once, shared with the prod stream. This file
# contributes only what genuinely differs: the trigger, the registry, the dist-tag, and the fact
# that rc bumps a prerelease while prod publishes what is committed.
#
# WHY THE RESHAPE. As a standalone workflow this file duplicated the entire resolve -> build ->
# verify -> publish spine, dropped five gates the prod path enforces (including the ADR-005 dist
# contents audit), and sat outside `check-release-graph.mjs`, whose payload assertions key on a
# single named job in a single named file. Measured at the time: deleting the publish step, or
# dropping `--tag rc`, left every gate in the repository green.
#
# `develop` does not yet track the train automatically — REL1's promotion App is pending — so
# `develop` is advanced by an explicit push, and that push is this trigger. That limits how OFTEN
# this runs, not whether it is correct.
on:
  push:
    branches: [develop]

# NARROWED HERE, deliberately. A `workflow_call` job cannot vary its own permissions by input, so
# `publish-packages.yml` declares `contents: write` for the prod path's GitHub Release. The rc
# stream cuts no Release and needs no write to contents; the caller's block is the mechanism that
# takes it away again.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rc:
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: read
      packages: write
    with:
      registry: 'https://npm.pkg.github.com'
      # MANDATORY. Omitting it makes npm write `latest`, and the first publish of a package with no
      # existing versions would claim the prod channel from the rc stream — irreversible.
      dist-tag: rc
      # rc derives its next version from the registry, because nothing commits the bump back to
      # `develop`: without this every run recomputes the same version and publish #2 dies on
      # EPUBLISHCONFLICT.
      bump: true
      cut-release: false
    secrets: inherit
