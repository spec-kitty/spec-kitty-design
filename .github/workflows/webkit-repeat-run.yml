# WP01's measurement rig (mission webkit-timing-deflake-01M2T31J, C-009, C-005, NFR-001,
# NFR-002). A SEPARATE workflow, deliberately — the mission's own T001 requires that the
# ordinary `playwright` job in ci-quality.yml is not altered, and scripts/check-gate-wiring.mjs
# / scripts/check-ci-quality-trigger-parity.mjs both enforce that job's shape byte-for-byte.
# Neither checker inspects any workflow file other than ci-quality.yml, so this file's existence
# and its own job cannot trip either gate — verified by running both against this tree.
#
# WHY `on.push` AS WELL AS `workflow_dispatch`: `workflow_dispatch` alone is not usable until
# this exact file reaches the repository's default branch — ci-quality.yml's own
# `workflow_dispatch` entry carries the identical caveat in a comment for the identical reason
# (research.md R18). Scoping `on.push` to this mission's own branches (its integration branch
# and its lane worktree branches) is what lets the rig actually run — and be measured — WHILE
# the mission is still in flight, which is the whole point of a pre-fix baseline (T003).
# `workflow_dispatch` stays declared for reuse once this file lands on main.
name: WebKit repeat-run rig

on:
  push:
    branches:
      - mission/webkit-deflake
      - 'kitty/mission-webkit-timing-deflake-01M2T31J-lane-*'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Repeats per item (NFR-001 default: 10)'
        required: false
        default: '10'
      items:
        description: 'Comma-separated item numbers to run (default: all twelve)'
        required: false
        default: ''

concurrency:
  group: webkit-repeat-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repeat-run:
    runs-on: ubuntu-latest
    # Generous ceiling, not a target (same convention as ci-quality.yml's own header comment):
    # 200 webkit test executions (140 line-addressable + 60 for item 12's six modes, at
    # repeat-each=10) is a small fraction of the ordinary `playwright` job's whole testDir run,
    # which itself budgets under this same figure at 25.6 min for the FULL suite.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      # webkit only (C-005: this mission's affected tests are webkit-only); chromium is NOT
      # installed here because this job draws no conclusion about chromium at all (NFR-007).
      - run: npx playwright install --with-deps webkit
      - name: "[MEASUREMENT] Build Storybook (rig prerequisite — same builder the ordinary playwright job's storybook-build stage runs)"
        run: node scripts/build-storybook-with-budget.mjs
      - name: "[MEASUREMENT] WebKit repeat-run rig (NFR-001, NFR-002, C-005, C-009)"
        env:
          REPEAT_EACH: ${{ github.event.inputs.repeat_each }}
          ITEMS: ${{ github.event.inputs.items }}
        run: |
          set -euo pipefail
          ARGS=(--json-dir=webkit-repeat-run-results "--repeat-each=${REPEAT_EACH:-20}" --items=6,7,8,9)
          if [ -n "${ITEMS:-}" ]; then ARGS+=("--items=${ITEMS}"); fi
          node scripts/webkit-repeat-run.mjs "${ARGS[@]}"
      # ---------------------------------------------------------------------------------------
      # SHARED-CAUSE EXPERIMENT (mission 453) — paired arms, ONE runner, ONE build, ONE SHA.
      #
      # Four samples of the rig showed items 6-10 failing in a ROTATING pattern: every one of
      # the shell-layout sub-tests and the workflow-board scroll test has been both green and
      # red across runs, none consistently broken, while the colour and computed-style items
      # (1-5, 11, 12) stayed stable at 10/10 every time. Rotation across TWO different spec
      # files is not a defect in any one test, so the operator directed an investigation into
      # what those five share.
      #
      # The candidate: playwright.config.ts sets `fullyParallel: true` + `workers: 2` under CI,
      # so repeats of one test run CONCURRENTLY in two webkit contexts on a two-core runner.
      # The five rotating items are all geometry-after-layout measurements (exact 56/240px
      # columns, region order, scroll offset); the stable ones assert colour and computed style
      # and do not care how long layout took.
      #
      # Both arms run the SAME items on the SAME runner against the SAME build, so
      # runner-to-runner variance cannot explain a difference between them. Arm A runs first and
      # therefore warms the machine, which makes arm B the easier condition -- read a clean B as
      # suggestive, not conclusive, and read a still-rotating B as strong evidence AGAINST the
      # contention hypothesis.
      #
      # `continue-on-error` on both: the rig exits non-zero whenever any repeat fails, which is
      # its correct behaviour, and arm A failing must not prevent arm B from running.
      # ---------------------------------------------------------------------------------------
      - name: "[EXPERIMENT] Arm A — items 6-10 at the INHERITED worker count (2 under CI)"
        id: arm_a
        # `if: always()` as well as `continue-on-error`: the two cover different things.
        # continue-on-error stops THIS step's own failure from failing the job; `always()`
        # stops the PRECEDING step's failure from skipping it. The rig step above exits
        # non-zero whenever any item fails, which is its correct behaviour and the normal
        # case here -- without `always()` both arms are silently skipped and the job still
        # reports as though the experiment ran. It did exactly that on run 35369475589.
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          node scripts/webkit-repeat-run.mjs \
            --json-dir=webkit-repeat-run-results/arm-a-workers-2 \
            --repeat-each=10 --items=6,7,8,9,10
      - name: "[EXPERIMENT] Arm B — the same items at --workers=1 (measurement control)"
        id: arm_b
        # `if: always()` as well as `continue-on-error`: the two cover different things.
        # continue-on-error stops THIS step's own failure from failing the job; `always()`
        # stops the PRECEDING step's failure from skipping it. The rig step above exits
        # non-zero whenever any item fails, which is its correct behaviour and the normal
        # case here -- without `always()` both arms are silently skipped and the job still
        # reports as though the experiment ran. It did exactly that on run 35369475589.
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          node scripts/webkit-repeat-run.mjs \
            --json-dir=webkit-repeat-run-results/arm-b-workers-1 \
            --repeat-each=10 --items=6,7,8,9,10 --workers=1
      - name: "[EXPERIMENT] Arm outcomes (neither arm's exit code gates this job)"
        if: always()
        run: |
          echo "arm A (workers=2, inherited): ${{ steps.arm_a.outcome }}"
          echo "arm B (workers=1, control):   ${{ steps.arm_b.outcome }}"
          echo "Read the per-item tables in each arm's log section, not these outcomes:"
          echo "the rig exits non-zero if ANY repeat of ANY item failed, so both arms can"
          echo "report 'failure' while differing sharply in WHICH items rotated and by how much."
      # `if: always()` — a failing run (expected for the pre-fix baseline, items 1 and 4) is
      # exactly the run whose JSON evidence a reviewer needs to re-derive the counts printed in
      # the job log.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact v4.6.2
        if: always()
        with:
          name: webkit-repeat-run-results
          path: webkit-repeat-run-results/
          retention-days: 14
