name: Publish packages (reusable)

# THE SHARED PUBLISH SPINE (REL2, #363, epic #361).
#
# WHY THIS EXISTS. `release.yml` (prod, tag-triggered) and `release-rc.yml` (rc, develop-triggered)
# were split by FILE when they differ only by INPUT — trigger, registry, dist-tag, whether to bump,
# whether to cut a GitHub Release. Splitting by file duplicated the entire resolve -> build ->
# verify -> publish structure, dropped five gates on the copy, and — the part that mattered — put
# the copy outside `check-release-graph.mjs`, whose seven payload assertions key on
# `jobs.release.steps` in one named file. All four review lenses reached that independently.
#
# So the payload lives HERE, once, and the callers are thin. `check-release-graph.mjs` audits this
# job; a separate, much smaller assertion checks that each caller actually delegates here and
# passes a dist-tag — because a thin caller has no publish step of its own, and a checker keyed on
# caller steps would pass it while auditing nothing. That blind spot is the one this reshape is
# meant to close, so it does not get rebuilt one level up.

on:
  workflow_call:
    inputs:
      registry:
        description: 'npm registry to publish to.'
        required: true
        type: string
      dist-tag:
        description: >-
          npm dist-tag. MANDATORY and never defaulted: omitting `--tag` makes npm write `latest`,
          and the first publish of a package with no existing versions would claim the prod
          channel from the rc stream. That is irreversible.
        required: true
        type: string
      bump:
        description: 'Bump the publishable set to the next prerelease before publishing (rc only).'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # THE CALLER'S `permissions:` IS A CEILING, NOT A NARROWING FILTER. An earlier revision of this
    # file declared `contents: write` here on the belief that the caller's smaller block would take
    # it away again. That is backwards: a called workflow declaring ABOVE the caller's grant fails
    # workflow validation and the run never starts — "The nested job is requesting 'contents:
    # write', but is only allowed 'contents: read'". The rc caller grants `contents: read`, so the
    # rc stream could not have started at all.
    #
    # So this declares the payload's true minimum. `packages: write` is load-bearing — without it
    # GITHUB_TOKEN cannot publish to GitHub Packages. Nothing else in this job writes to contents:
    # the audit gate runs `npm audit` only, and the bump touches manifests on the runner's disk and
    # never commits or pushes. Cutting a GitHub Release DOES need `contents: write`, which is
    # exactly why it is no longer here — see the SBOM upload below.
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: ${{ inputs.registry }}
      - run: npm ci --ignore-scripts

      - name: "[ENFORCED] Security gate before publish (ADR-005)"
        run: bash scripts/npm-audit-gate.sh

      # DERIVED, not listed. CAPTURED INTO VARIABLES AND ASSERTED, never interpolated into `echo`:
      # `set -e` does not propagate a failed command substitution when the enclosing command is
      # `echo`, so `dirs=` would be written empty, the step would exit 0, and `for pkg in ; do`
      # would iterate zero times and succeed — publishing nothing while reporting a green release.
      - name: Resolve the publishable package set
        id: graph
        run: |
          set -euo pipefail
          PROJECTS="$(node scripts/release-graph.mjs --projects)"
          DIRS="$(node scripts/release-graph.mjs --dirs)"
          [ -n "$PROJECTS" ] || { echo "::error::empty build set"; exit 1; }
          [ -n "$DIRS" ]     || { echo "::error::empty publish set"; exit 1; }
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $DIRS"

      - name: Build the buildable set
        run: npx nx run-many --target=build --projects=${{ steps.graph.outputs.projects }}

      - name: "[ENFORCED] The release gate can see its own failures (SC-003)"
        run: node scripts/check-release-graph.mjs --selftest
      - name: "[ENFORCED] Release graph is coherent (FR-003, FR-004)"
        run: node scripts/check-release-graph.mjs
      - name: "[ENFORCED] Packed Vue declarations compile without workspace paths (#149)"
        run: node scripts/check-vue-packed-types.mjs
      - name: "[ENFORCED] Sizes and the SRI hash match the built artifacts (FR-005, NFR-004)"
        run: node scripts/measure-elements-sizes.mjs --check

      # ADR-005. Dropped from the rc path when it was a separate file; restored here because the
      # gate set is a property of the artifact, not of which workflow happens to publish it.
      - name: "[ENFORCED] Dist contents audit — no secrets/sourcemaps (ADR-005)"
        run: |
          set -euo pipefail
          PKGS="${{ steps.graph.outputs.dirs }}"
          [ -n "$PKGS" ] || { echo "::error::empty publish set reached the audit loop"; exit 1; }
          for pkg in $PKGS; do
            echo "=== packages/$pkg ==="
            ( cd "packages/$pkg" && npm pack --dry-run 2>&1 | grep "npm notice" | grep -v "===" )
          done

      - name: Generate CycloneDX SBOM (FR-045)
        run: |
          npx @cyclonedx/cyclonedx-npm \
            --output-format json \
            --output-file spec-kitty-design-sbom.cdx.json

      # LAST BEFORE PUBLISH, DELIBERATELY. This step rewrites `version` and every intra-scope range
      # in all four publishable manifests, and `package.json` is inside every tarball — so it moves
      # each package's `unpackedSize`. Running it BEFORE the size gate (where it used to sit) meant
      # `measure-elements-sizes.mjs --check` compared the committed record against manifests the
      # previous step had just mutated. Measured: `@spec-kitty/styles` renders at 844.1 KiB and sits
      # ONE byte below the next 0.1-KiB bucket, and the bump adds seven — so the very first rc run
      # died on size drift before reaching publish. Re-recording cannot fix that: the committed
      # record must match the UNBUMPED tree, which is what every PR checks.
      #
      # Nothing above this line needs the bumped versions: the four `[ENFORCED]` gates and the
      # contents audit assert artifact CONTENTS, not version strings.
      #
      # `--from-registry` derives the next rc from what is already published rather than from the
      # committed version, because nothing commits the bump back: without it every run recomputes
      # the same version and the second publish dies on EPUBLISHCONFLICT.
      - name: Bump the publishable set to the next prerelease
        if: ${{ inputs.bump }}
        run: node scripts/bump-prerelease.mjs --from-registry

      # `set -euo pipefail` is load-bearing: without it a failing `npm publish` inside a `for` loop
      # does not fail the step, and the workflow reports a successful release having published a
      # subset. EPUBLISHCONFLICT is tolerated only on a re-run, matching release.yml's reasoning:
      # a conflict on attempt 1 means the name+version is on the registry and this workflow did not
      # put it there.
      - name: Publish every package in the derived set
        run: |
          set -euo pipefail
          PKGS="${{ steps.graph.outputs.dirs }}"
          TAG="${{ inputs.dist-tag }}"
          [ -n "$PKGS" ] || { echo "::error::empty publish set reached the publish loop"; exit 1; }
          [ -n "$TAG" ]  || { echo "::error::no dist-tag supplied; refusing to let npm default to latest"; exit 1; }
          failed=""
          for pkg in $PKGS; do
            echo "=== publishing packages/$pkg under $TAG ==="
            if out="$( cd "packages/$pkg" && npm publish --tag "$TAG" 2>&1 )"; then
              echo "$out"
            else
              echo "$out"
              if echo "$out" | grep -qE "code (EPUBLISHCONFLICT|E409)" && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
                echo "::warning::packages/$pkg already published at this version — treating as resumption"
              else
                # HALT, do not accumulate. Ported from release.yml, which argues it at length and
                # which this file was supposed to consolidate rather than diverge from: the set is
                # published in TOPOLOGICAL order precisely so a package goes out after everything it
                # depends on. Continuing past a real failure spends that guarantee in the only case
                # it was for — if `tokens` fails, `styles`, `elements` and `react` publish anyway
                # (npm publish does not resolve peers, so all three succeed) and every consumer
                # install then hard-fails E404 on the missing peer. Those versions are permanent.
                # Resumability comes from the skip-on-conflict branch above, not from continuing.
                echo "::error::halting — every package after $pkg in the derived set may depend on it"
                failed="$failed $pkg"
                break
              fi
            fi
          done
          [ -z "$failed" ] || { echo "::error::failed to publish:$failed"; exit 1; }

      # Non-`latest` dist-tags never appear in the GitHub web UI version list, so this is the only
      # place an operator can see that the publish actually landed.
      - name: Report the published dist-tags
        run: |
          set -euo pipefail
          for pkg in ${{ steps.graph.outputs.dirs }}; do
            NAME="$(node -p "require('./packages/$pkg/package.json').name")"
            echo "=== $NAME ==="
            npm view "$NAME" dist-tags || echo "(not yet readable — first publish propagating)"
          done

      # THE RELEASE STEP IS DELIBERATELY NOT HERE. Cutting a GitHub Release needs `contents: write`,
      # and declaring that in this job is what made the rc stream unstartable (see the permissions
      # block above). It is also prod-only, so it does not belong in a shared spine. The SBOM leaves
      # as an artifact instead, and REL3's prod caller attaches it from a job of its own that grants
      # itself `contents: write` — the caller can hold a permission this payload must not.
      #
      # REL3 NOTE, recorded so the fold does not silently downgrade prod: converting `release.yml`
      # to a caller must also restore `id-token: write` (npm provenance, FR-044) and `--access
      # public` on the publish. Both are absent here because the rc stream needs neither, and both
      # fail QUIETLY — provenance degrades without an error, scoped packages default to restricted.
      - name: Upload the SBOM for the caller to attach
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact v4.6.2
        with:
          name: sbom
          path: spec-kitty-design-sbom.cdx.json
          if-no-files-found: error
