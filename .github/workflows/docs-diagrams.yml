name: Docs Diagrams (drift check)

on:
  pull_request:
    paths: ["docs/architecture/assets/**"]
  push:
    branches: [main]
    paths: ["docs/architecture/assets/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # The rendering browser is pinned via Playwright's exactly-pinned Chromium
      # rather than apt's. Necessary but not sufficient: the theme's font stack
      # resolves per host, so this runner and a contributor machine still render
      # different geometry. See the artifact step below.
      - name: Install pinned Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: "[ENFORCED] Render diagrams — drift check (FR-014, FR-015)"
        id: drift
        run: node scripts/render-diagrams.js --check

      # The theme's fontFamily is "ui-sans-serif, system-ui, sans-serif" — a stack
      # that resolves to whatever the host has, so mermaid's text metrics, and
      # therefore every diagram's geometry, differ between a contributor machine
      # and this runner. No contributor can reproduce these bytes locally. On
      # failure, publish what the runner rendered so the fix is a download rather
      # than a guessing game.
      # Conditioned on the drift step specifically, not on job failure: if npm ci
      # or the browser install fails, the working tree still holds the COMMITTED
      # bytes, and publishing those as "runner-rendered" would hand a contributor
      # a no-op commit and a still-red gate.
      - name: Publish runner-rendered SVGs (drift only)
        if: failure() && steps.drift.conclusion == 'failure'
        run: node scripts/render-diagrams.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact v4.6.2
        if: failure() && steps.drift.conclusion == 'failure'
        with:
          name: runner-rendered-svgs
          path: docs/architecture/assets/*.svg
          if-no-files-found: error
          retention-days: 30
