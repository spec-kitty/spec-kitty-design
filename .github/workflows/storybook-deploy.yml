name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Storybook source and configuration
      - "apps/storybook/**"
      # Publishable packages that feed the Storybook catalog
      - "packages/tokens/**"
      - "packages/styles/**"
      # Static demo pages
      - "apps/demo/**"
      # Workflow file itself, and the script holding its assembly logic
      - ".github/workflows/storybook-deploy.yml"
      - "scripts/assemble-demo-dist.sh"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci --ignore-scripts
      # CAPTURED, not interpolated. `set -e` does NOT propagate a failed command substitution in
      # argument position — `--projects=$(failing-cmd)` yields `--projects=` and rc 0, and nx then
      # treats an empty filter as ALL projects. release.yml documents this at length; a lens caught
      # that the same commit reintroduced the pattern here, where there is no downstream backstop.
      - run: |
          set -euo pipefail
          PROJECTS="$(node scripts/release-graph.mjs --projects)"
          [ -n "$PROJECTS" ] || { echo "::error::empty build set"; exit 1; }
          npx nx run-many --target=build --projects="$PROJECTS"
      - run: npx nx run storybook:storybook:build

      # Assembly + the resolution check live in scripts/assemble-demo-dist.sh so
      # ci-quality.yml can run the identical code on every PR. Before M2 (#68)
      # these steps existed only here, on push to main, so the demo surface was
      # verified nowhere until it was already deployed.
      - name: Assemble demo surface into Storybook dist
        run: bash scripts/assemble-demo-dist.sh apps/storybook/storybook-static

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # actions/configure-pages v6.0.0
        with:
          enablement: true  # auto-enable Pages if not already configured via Settings → Pages → GitHub Actions
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # actions/upload-pages-artifact v3.0.1
        with:
          path: apps/storybook/storybook-static/
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # actions/deploy-pages v5.0.0
        id: deployment
