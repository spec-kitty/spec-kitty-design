<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace connection — settings</title>
    <meta
      name="description"
      content="Connect exactly one workspace and name the connection."
    />
    <style>
      /* ============================================================================
       * 1. @spec-kitty/tokens — tokens.css :root block, pasted verbatim.
       *    Theme is pinned to the library default (dark) via <html data-theme="dark">,
       *    so the light-theme override blocks are not carried in this single-file
       *    artifact. No --sk-* name or value is redefined below this block.
       *
       *    FONTS: the library's woff2/otf assets cannot be emitted alongside a single
       *    self-contained HTML file, so no @font-face rules are declared here. The
       *    authoritative --sk-font-* stacks are preserved unchanged and resolve to
       *    their documented system fallbacks. No remote font, CSS, script or icon
       *    dependency is used anywhere in this file.
       * ========================================================================= */

      /* @spec-kitty/tokens — ADR-003 naming schema: --sk-<category>-<name> */
      /* Values reconciled with Spec Kitty Design System reference (colors_and_type.css). */
      :root {
        /* ── Brand Colors ────────────────── */
        /* Core palette — yellow is the signature primary. */
        --sk-color-yellow:        #F5C518;   /* signature primary, CTAs, logo bow */
        --sk-color-yellow-soft:   #FFD84D;   /* hover / highlight */
        --sk-color-yellow-deep:   #C99A0E;   /* pressed / on-light fg */
        /* Yellow alpha buckets — see PLAN-001 for naming rationale.
           Suffix is the rounded percent of the alpha channel. */
        --sk-color-yellow-alpha-15: rgba(245, 197, 24, 0.14);
        --sk-color-yellow-alpha-35: rgba(245, 197, 24, 0.35);
        --sk-color-yellow-alpha-60: rgba(245, 197, 24, 0.60);
        --sk-color-haygold:       #D9B36A;   /* muted warm gold, bullet dots, dim accents */
        --sk-color-haygold-soft:  #E8C988;
        --sk-color-blue:          #A9C7E8;   /* soft icy blue (illustration sky / muted info) */
        --sk-color-blue-deep:     #6B8FB8;   /* hover state for blue */
        --sk-color-blue-bg:       #14202E;   /* deep blue surface for muted-info panel */
        --sk-color-purple:        #B8A9E0;   /* soft lavender, v2.x evolution accent */
        --sk-color-purple-deep:   #8C7AC2;
        --sk-color-purple-bg:     #1E1A2E;   /* deep purple surface for v2.x section banners */
        --sk-color-green:         #8FCB8F;   /* checkmark / success / "by the numbers" */
        --sk-color-green-bg:      #15241A;   /* dark green surface behind numbers banner */
        /* Brand red — DECORATIVE AND GRAPHIC ONLY, and deliberately dark-only with no light override.
           Its live consumers are ribbon-card's fill and decorative border and transition-matrix's
           blocked-row graphic. It is NOT the validation colour: this comment used to say "validation
           errors" and that is exactly how #350 happened — an author greps for the error colour, lands
           here, and writes a token with no light value into a light-theme boundary, silently. For
           validation use `--sk-fg-error` (L211/L459, text, 4.5:1) or `--sk-border-control-invalid`
           (L251/L472, non-text boundary, 3:1 and never less visible than the resting boundary).
           The obligations its own remaining consumers carry are unguarded and tracked in #398. */
        --sk-color-red:           #E97373;
        --sk-color-red-soft:      #F0A0A0;
        --sk-color-sage:          #4F8F4F;   /* heading sage on cream (light-mode only) */
        --sk-color-sage-deep:     #3D7A3D;   /* hover / pressed — AND the light-mode --sk-color-accent
                                                  since #78, so the light ramp has no darker sage left
                                                  for an accent hover state. Extend the ramp if one is
                                                  ever needed rather than reusing -soft upward. */
        --sk-color-sage-soft:     #7CAE7C;   /* dim / 70% sage for chips */

        /* ── Accent ──────────────────────── */
        --sk-color-accent:        #F5C518;   /* interactive accent (= yellow) */
        --sk-color-accent-fg:     #1A1408;   /* dark ink on yellow buttons */

        /* ── Dark Surfaces (default — dark mode) ─── */
        --sk-surface-page:        #0D0E11;   /* blackish — deepest page background */
        --sk-surface-hero:        #121317;   /* hero / section background */
        --sk-surface-card:        #181A1F;   /* card surface */
        --sk-surface-input:       #1C1F25;   /* elevated card / form input fill */
        --sk-surface-pill:        #212830;   /* off-gray — nav pill, chips, hover row */
        --sk-surface-muted:       #262C36;   /* dark gray — muted info panel, code block */

        /* ── Section Tint Surfaces ───────── */
        /* Dark-mode tint surfaces for cards, status panels, section banners. */
        --sk-surface-tint-mint:   #15241A;   /* dark: numbers banner / green */
        --sk-surface-tint-butter: #2A2410;   /* dark: warm-yellow card */
        --sk-surface-tint-lilac:  #1E1A2E;   /* dark: v2.x banner / purple */
        --sk-surface-tint-sky:    #14202E;   /* dark: muted info / blue */
        /* ROSE completes the family at #177, and it is a DERIVATION, not a new brand hue.
           --sk-color-red already exists (#E97373) and is already the danger marker in
           sk-status-indicator; what the family lacked was its SURFACE, so `--sk-status-danger`
           had nothing to alias and would have had to carry a literal of its own.
           Derived by the rule the four siblings already follow, measured in HLS: the hue's own
           angle (0deg), dark tints at L 0.11-0.14 (mint 0.112, butter 0.114, sky 0.129,
           lilac 0.141 -> rose 0.125), saturation in the family's 0.26-0.45 band (0.35). */
        --sk-surface-tint-rose:   #2B1515;   /* dark: danger / red */

        /* ── Tint borders — the third slot of the tint family ─────────────────────
           Named for the TINT (sky/lilac), not the component. --sk-surface-tint-sky is
           already shared by card and blog-card, and --sk-surface-tint-lilac by card and
           pill-tag; a component-named border would have put this on an
           N-components x M-variants path (--sk-border-feature-card-*, and so on) beside a
           family that already scales. Completes surface-tint / on-tint / border-tint.
           These exist as TOKENS, not as theme-selector overrides in sk-card.css,
           because a custom property inherits THROUGH a shadow boundary and a selector
           does not. sk-card.css previously carried
             :root[data-theme="light"] .sk-card--blue, .sk-light .sk-card--blue { ... }
           which is inert once the card is a custom element: the themed ancestor is
           outside the shadow root and the descendant combinator cannot reach in. No
           error, no warning — a LightMode story would simply render dark styling.
           `:host-context()` is not the escape hatch (Baseline limited, Chromium-only).
           Verified in this mission; see #72 and ADR-9. */
        --sk-border-tint-sky:    rgba(169, 199, 232, 0.20);  /* channels from --sk-color-blue */
        --sk-border-tint-lilac:  rgba(184, 169, 224, 0.25);  /* channels from --sk-color-purple */

        /* ── On-Tint Foregrounds ─────────── */
        --sk-on-tint-mint:        var(--sk-color-green);
        --sk-on-tint-butter:      var(--sk-color-yellow-soft);
        --sk-on-tint-lilac:       var(--sk-color-purple);
        --sk-on-tint-sky:         var(--sk-color-blue);
        --sk-on-tint-rose:        var(--sk-color-red);

        /* ── Data visualisation ──────────── */
        --sk-color-data-series-primary: var(--sk-on-tint-sky);
        --sk-color-data-grid: var(--sk-border-default);
        --sk-color-data-baseline: var(--sk-fg-subtle);

        /* ── Chart family (#179) ─────────────────────────────────────────────────
           THE chart token family. #179 asked this mission to consume a --sk-chart-*
           family #148 was expected to land; measured on train/elements-first@5fd031d,
           `grep -oE '--sk-chart-[a-z-]+' packages/tokens/src/tokens.css` returned
           NOTHING. #148 shipped the three --sk-color-data-* aliases immediately above
           instead. #179's own instruction covers exactly this case: "If #148 lands
           without it, the gap is closed here, once, for both."

           So the family is landed here, and the three roles it SHARES with #148 are
           given the SAME underlying values rather than new ones. That is not a
           comment: fixtures/elements-behaviour/src/sk-time-series-chart.test.ts
           asserts --sk-chart-series-1/grid/baseline resolve to the same COMPUTED
           values as --sk-color-data-series-primary/grid/baseline, in BOTH themes.
           One family serves both elements today, and the eventual retrofit of
           sk-bar-chart is a pure rename.

           sk-bar-chart is deliberately NOT retrofitted here. Doing so would rewrite
           its authored CSS, its generated module, its class JSDoc "Token
           dependencies" line — which is PUBLISHED API, copied into
           custom-elements.json and into the React wrapper's prop docs — and the
           `semantic data aliases exist exactly once per theme` test, which pins each
           --sk-color-data-* declaration by exact string twice per theme block. That
           is not "small and mechanical" on an element that landed unchanged one
           mission ago, and #179 binds this mission to extend none of its API. Filed
           as #240, with the surface-by-surface measurement attached, rather than
           half-done.

           FOUR series inks, not one, because a line chart carries more than one
           series and the fourth channel matters: hue COLLAPSES under forced colors,
           so differentiation is also carried by --sk-chart-dash-*, and by marker
           shape in the element's own geometry. Measured against --sk-surface-card:
           dark 9.97 / 9.21 / 8.11 / 12.58, light 9.10 / 8.04 / 9.42 / 6.79 — every
           one over the 3:1 floor the element asserts in both themes. The gap ink is
           7.45 dark / 6.76 light. The grid is deliberately low-contrast (1.33 / 1.27)
           because it is a rule, not content, which is why the element's contrast
           assertion covers the series, baseline and gap inks and not the grid. */
        --sk-chart-series-1: var(--sk-on-tint-sky);
        --sk-chart-series-2: var(--sk-on-tint-mint);
        --sk-chart-series-3: var(--sk-on-tint-lilac);
        --sk-chart-series-4: var(--sk-on-tint-butter);
        --sk-chart-grid: var(--sk-border-default);
        --sk-chart-baseline: var(--sk-fg-subtle);
        --sk-chart-gap: var(--sk-fg-muted);
        --sk-chart-gap-fill: rgba(169, 169, 176, 0.14);  /* channels from --sk-fg-muted */
        --sk-chart-dash-1: none;
        --sk-chart-dash-2: 8 4;
        --sk-chart-dash-3: 2 3;
        --sk-chart-dash-4: 10 3 2 3;
        --sk-chart-gap-dash: 3 3;
        --sk-chart-stroke-width: var(--sk-border-width-2);
        --sk-chart-plot-block-size: calc(var(--sk-space-10) * 4);

        /* ── Operational Status — semantic pairs (#177) ───────────────────────────
           ONE tone vocabulary, owned by sk-status-indicator (#146) and consumed here:
           neutral | info | success | attention | danger | recovery.

           ALIASES, not a palette. Every value below resolves to a token that already
           exists; this category adds meaning, not colour. It is declared in BOTH theme
           blocks even though the aliases are identical, because a status token defined
           in one block only is exactly the half-populated theme #93 records — and a
           reader checking "does light have status?" must be able to answer from the
           light block.

           PAIRING (hard rule 3): --sk-status-<tone> is the SURFACE, --sk-on-status-<tone>
           is its foreground and the card's edge colour. Two contrast contracts hold, and
           both were measured in sRGB rather than assumed:
             (a) the card's own foreground, --sk-fg-body, on the status surface;
             (b) the pair itself, --sk-on-status-<tone> on --sk-status-<tone>.
           DARK       (a) --sk-fg-body #D6D6DA      (b) pair        edge vs page
             neutral        9.69                       6.01            8.26
             info          11.36                       9.42           11.05
             success       11.15                       8.55           10.21
             attention     10.67                      11.18           13.95
             danger        11.87                       5.87            6.58
             recovery      11.66                       7.88            9.00
           AA needs 4.5 for (a) and (b); WCAG 1.4.11 needs 3 for the edge. */
        --sk-status-neutral:      var(--sk-surface-muted);
        --sk-status-info:         var(--sk-surface-tint-sky);
        --sk-status-success:      var(--sk-surface-tint-mint);
        --sk-status-attention:    var(--sk-surface-tint-butter);
        --sk-status-danger:       var(--sk-surface-tint-rose);
        --sk-status-recovery:     var(--sk-surface-tint-lilac);

        --sk-on-status-neutral:   var(--sk-fg-muted);
        --sk-on-status-info:      var(--sk-on-tint-sky);
        --sk-on-status-success:   var(--sk-on-tint-mint);
        --sk-on-status-attention: var(--sk-on-tint-butter);
        --sk-on-status-danger:    var(--sk-on-tint-rose);
        --sk-on-status-recovery:  var(--sk-on-tint-lilac);

        /* ── Pill/Chip Background ────────── */
        --sk-bg-pill:             #212830;   /* nav pill rail, chips, hover row */

        /* ── Foreground / Text ───────────── */
        --sk-fg-default:          #FFFFFF;   /* headlines — maps to --sk-fg-0 */
        --sk-fg-body:             #D6D6DA;   /* body text — maps to --sk-fg-1 */
        --sk-fg-muted:            #A9A9B0;   /* secondary body, muted copy — maps to --sk-fg-2 */
        /* tertiary / labels — maps to --sk-fg-3. Was #6E6E78, which failed WCAG AA on
           BOTH surfaces: 3.45:1 on --sk-surface-card and 3.83:1 on --sk-surface-page.
           #81818B is the minimum same-hue lightening that clears 4.5:1 (4.51 / 5.01). #101 */
        --sk-fg-subtle:           #81818B;
        --sk-fg-placeholder:      #4A4A52;   /* placeholder text — maps to --sk-fg-4 */
        --sk-fg-on-primary:       #1A1408;   /* dark ink on yellow buttons */
        --sk-fg-on-card:          #D6D6DA;   /* text on card surface */
        /* Error-copy foreground (WCAG 1.4.3, ≥4.5:1 for small text) — #350, fixing #321's own gap.
           `--sk-color-red` carries three incompatible contrast contracts at once (this text
           contract, --sk-border-control-invalid's 3:1 non-text contract below, and ribbon-card's
           fill/paired-foreground contract) and has no light override, so any single-hex fix for one
           contract regresses another. An INDEPENDENTLY DECLARED LITERAL, deliberately NOT
           var(--sk-color-red) (dark) or var(--sk-on-tint-rose) (light) — same decoupling rationale
           --sk-border-control's own comment gives below: aliasing would couple this 4.5:1 text
           obligation to tokens that move for unrelated reasons, and check-token-breaking-changes.sh
           computes no contrast, so nothing would catch a future silent regression of that coupling.
           NO NEW COLOUR: both hexes already exist and are already ratified in this file — #E97373 =
           --sk-color-red (:root, L24, "validation errors") and #6B2424 = --sk-on-tint-rose (light
           block, derived in HLS under #177, ratified #217). This token adds a NAME, not a value.
           Measured (relative-luminance formula, both themes, five surfaces — page/card/input/muted/
           pill): dark #E97373 — page 6.58:1, card 5.94:1, input 5.63:1, muted 4.79:1, pill 5.08:1;
           light #6B2424 — page 10.12:1, card 11.04:1, input 9.78:1, muted 8.52:1, pill 8.93:1. All
           ten clear the 4.5:1 floor. Mechanically enforced by
           tests/node/form-input-border-control-contrast.test.ts. */
        --sk-fg-error:            #E97373;

        /* ── Borders ─────────────────────── */
        --sk-border-default:      #2B313B;   /* hairline default — slightly cool */
        --sk-border-strong:       #353C48;   /* card border */
        --sk-border-focus:        #F5C518;   /* focus ring (= yellow) */
        /* Non-text control boundary (WCAG 1.4.11, ≥3:1) — #321. An INDEPENDENTLY DECLARED
           LITERAL, deliberately NOT var(--sk-fg-subtle): aliasing would couple this border's 3:1
           non-text obligation to a token that moves for an unrelated text-contrast (4.5:1) reason,
           and check-token-breaking-changes.sh computes no contrast, so nothing would catch a future
           silent regression of that coupling. Measured (relative-luminance formula, both themes,
           five surfaces — page/card/input/muted/pill): dark #81818B — page 5.01:1, card 4.51:1,
           input 4.28:1, muted 3.64:1, pill 3.86:1; light #7A7A6E — page 3.98:1, card 4.34:1,
           input 3.85:1, muted 3.35:1, pill 3.51:1. Tightest of the ten (theme x surface) pairs is
           light vs muted at 3.35:1 — 0.35 of headroom above the 3:1 floor, the margin a future
           nudge of this hex must not spend. Mechanically enforced by
           tests/node/form-input-border-control-contrast.test.ts. */
        --sk-border-control:      #81818B;
        /* Invalid-state control boundary (WCAG 1.4.11, ≥3:1, AND ≥ --sk-border-control on the same
           surface/theme) — #350, fixing #321's own gap: #321 raised the resting boundary and
           deliberately left `[aria-invalid="true"]`/`:invalid` on --sk-color-red, which made the
           ordering visible and, in light theme, wrong (light invalid measured BELOW the resting
           boundary on all five surfaces — the exact inverse of the intended emphasis). An
           INDEPENDENTLY DECLARED LITERAL, deliberately NOT var(--sk-color-red) (dark) or
           var(--sk-on-tint-rose) (light) — same decoupling rationale as --sk-border-control above:
           --sk-color-red still serves ribbon-card's fill and transition-matrix's blocked-row
           graphic; --sk-on-tint-rose's own contract is "readable on --sk-surface-tint-rose", not
           "readable on five neutral surfaces". check-token-breaking-changes.sh computes no contrast,
           so nothing would catch a future silent regression of that coupling.
           NO NEW COLOUR: both hexes already exist and are already ratified in this file — #E97373 =
           --sk-color-red (:root, L24) and #6B2424 = --sk-on-tint-rose (light block, #177/#217). This
           token adds a NAME, not a value.
           Measured against --sk-border-control on the same surface/theme:
             dark #E97373  — page 6.58:1 (vs 5.01:1), card 5.94:1 (vs 4.51:1), input 5.63:1
               (vs 4.28:1), muted 4.79:1 (vs 3.64:1), pill 5.08:1 (vs 3.86:1) — byte-identical to
               today's rendering; these five numbers are also the FR-004 dark non-regression floor.
             light #6B2424 — page 10.12:1 (vs 3.98:1), card 11.04:1 (vs 4.34:1), input 9.78:1
               (vs 3.85:1), muted 8.52:1 (vs 3.35:1), pill 8.93:1 (vs 3.51:1) — every surface now
               clears both the 3:1 absolute floor and the resting boundary, closing #350's inversion.
           Mechanically enforced by tests/node/form-input-border-control-contrast.test.ts. */
        --sk-border-control-invalid: #E97373;
        --sk-border-width-1:      1px;
        --sk-border-width-2:      2px;
        /* The accent-edge step. Theme-invariant, like -1 and -2, so it is defined once here and
           is NOT restated in the light block. Added at #177 for sk-card's status edge: the card's
           border is already 2px on all four sides, so an edge treatment that reads as an edge
           needs a step above it. */
        --sk-border-width-4:      4px;

        /* ── Typography — Families ───────── */
        /* --sk-font-sans is the BODY/UI face — self-hosted Inter (spec-kitty-saas mission #1673, spec-kitty-saas PR #2203). See the
           "Font loading" section below for the full rationale; the short version is that a
           consumer-visible, deterministic body face was needed for cross-machine visual-regression
           parity (spec-kitty-saas #2203), and Swansea — the previously *documented* body face — was
           never actually wired to this token and carries an unresolved licensing question (RISK-1,
           docs/architecture/validation/mission-review-01KQJNTP49SPQNNXQ1TG3BKKKW.md:148-157,215-219).
           The system stack stays as the fallback tail so a failed asset load still renders text. */
        --sk-font-sans:           'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        --sk-font-display:        'Falling Sky', ui-sans-serif, system-ui, sans-serif;
        --sk-font-reference:      'Swansea', ui-sans-serif, system-ui, sans-serif;
        --sk-font-condensed:      'Falling Sky Condensed', 'Falling Sky', ui-sans-serif, sans-serif;
        --sk-font-extended:       'Falling Sky Extended', 'Falling Sky', ui-sans-serif, sans-serif;
        --sk-font-outline:        'Falling Sky Outline', 'Falling Sky', ui-sans-serif, sans-serif;
        --sk-font-boldplus:       'Falling Sky Boldplus', 'Falling Sky', ui-sans-serif, sans-serif;
        --sk-font-mono:           'JetBrains Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;

        /* ── Typography — Scale ──────────── */
        --sk-text-xs:             0.75rem;    /* 12px — eyebrow labels */
        --sk-text-sm:             0.875rem;   /* 14px */
        --sk-text-base:           1rem;       /* 16px */
        --sk-text-lg:             1.125rem;   /* 18px — lead / h4 */
        --sk-text-xl:             1.25rem;
        --sk-text-2xl:            1.5rem;
        --sk-text-3xl:            1.875rem;

        /* ── Typography — Weights ────────── */
        --sk-weight-normal:       400;
        --sk-weight-medium:       500;
        --sk-weight-semibold:     600;
        --sk-weight-bold:         700;
        --sk-weight-extrabold:    800;

        /* ── Spacing ─────────────────────── */
        --sk-space-1:   0.25rem;   /*  4px */
        --sk-space-2:   0.5rem;    /*  8px */
        --sk-space-3:   0.75rem;   /* 12px */
        --sk-space-4:   1rem;      /* 16px */
        --sk-space-5:   1.25rem;   /* 20px */
        --sk-space-6:   1.5rem;    /* 24px */
        --sk-space-7:   2rem;      /* 32px */
        --sk-space-8:   2.5rem;    /* 40px */
        --sk-space-9:   3rem;      /* 48px */
        --sk-space-10:  4rem;      /* 64px */
        --sk-space-11:  6rem;      /* 96px */
        --sk-space-12:  8rem;      /* 128px */

        /* ── Layout ──────────────────────── */
        --sk-layout-personal-rail-width: 3.5rem;  /* 56px */
        --sk-layout-context-sidebar-width: 15rem; /* 240px */
        /* Browser-calibrated lower bound for a workflow lane (#209). 13.75rem is
           220px at the repository's 16px root: the smallest tested candidate in the
           220–360px sweep that keeps long opaque content contained, fits one lane at
           320/360px, and makes five lanes overflow locally without widening the page. */
        --sk-layout-workflow-lane-min-inline-size: 13.75rem;

        /* sk-page-header sticky geometry (#182). The offset is what the header pins itself
           at inside whatever scroll region the shell gives it; a consumer whose shell has its
           own fixed chrome above the header raises it. The compact height is the header's
           declared minimum block size at density="compact", which is a single-row form.
           The scroll-margin token is DERIVED from those two rather than restated, so the
           value a consumer puts on their own focusable content cannot drift from the
           header's footprint when either input is retuned (WCAG 2.4.11).

           THE THIRD TERM IS --sk-space-7 (32px) AND THAT IS MEASURED, NOT PADDING FOR
           LUCK. --sk-layout-page-header-compact-height is a MIN-block-size, so the
           header's real height is whatever its slotted content needs above that floor:
           measured 60px for a plain compact row at 900px, and 71px for this repo's own
           story, whose sync slot also carries a status pill. The term has to absorb that
           difference or the published margin is short for the element's own catalogue —
           it was --sk-space-4 (16px) for exactly one round, which made the default 64px
           against a 71px header. 32px clears the taller measurement by 9px.

           ITS DEFAULT COVERS THE COMPACT, SINGLE-ROW HEADER ONLY — a default-density header's height
           is the consumer's own slotted content, and a compact header narrower than
           720px stacks. Both cases override this token; see
           docs/design-system/using-components.md, which states the measurements. */
        --sk-layout-page-header-sticky-offset: 0rem;
        --sk-layout-page-header-compact-height: 3rem;   /* 48px */
        --sk-layout-page-header-sticky-layer: 10;
        --sk-layout-page-header-sticky-scroll-margin:
          calc(var(--sk-layout-page-header-sticky-offset) +
               var(--sk-layout-page-header-compact-height) +
               var(--sk-space-7));

        /* ── Radius ──────────────────────── */
        --sk-radius-sm:   0.5rem;    /*  8px — chips, eyebrow pills */
        --sk-radius-md:   0.75rem;   /* 12px — form inputs */
        --sk-radius-lg:   1rem;      /* 16px — cards */
        --sk-radius-xl:   1.25rem;   /* 20px — hero card */
        --sk-radius-pill: 999px;     /* nav pills, primary buttons */

        /* ── Shadows ─────────────────────── */
        --sk-shadow-card:          0 1px 0 rgba(255,255,255,0.02) inset, 0 1px 2px rgba(0,0,0,0.4);
        --sk-shadow-elev:          0 8px 24px rgba(0,0,0,0.45);
        --sk-shadow-glow-primary:  0 6px 20px -6px rgba(245,197,24,0.45);
        --sk-shadow-focus:         0 0 0 3px rgba(13,14,17,0.55), 0 0 0 4px rgba(43,49,59,0.6);

        /* ── Motion ──────────────────────── */
        --sk-motion-duration-fast: 120ms;
        --sk-motion-duration-base: 200ms;
        --sk-motion-duration-slow: 320ms;
        --sk-motion-ease-out:      cubic-bezier(0.22, 1, 0.36, 1);
        --sk-motion-ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);
      }

      /* ============================================================================
       * 2. Component sheets from @spec-kitty/styles 1.0.0.
       *    Every selector and declaration below is copied from the library's own
       *    component pages (card, radio-choice-group, form-field, button). Only the
       *    long in-source rationale comments are condensed — no rule, property,
       *    value or order is changed, and no class outside each component's published
       *    vocabulary is introduced.
       * ========================================================================= */

      /* ── component: card — packages/styles/src/card/sk-card.css ─────────────── */
      .sk-card {
        background: var(--sk-surface-card);
        border: 2px solid var(--sk-border-default);
        border-radius: var(--sk-radius-lg);
        color: var(--sk-fg-body);
        padding: var(--sk-space-7);
        transition: border-color var(--sk-motion-duration-fast) var(--sk-motion-ease-out);
      }

      .sk-card--inset {
        background: var(--sk-surface-input);
        border-color: var(--sk-border-default);
      }

      @media (prefers-reduced-motion: reduce) {
        .sk-card {
          transition: none;
        }
      }

      /* ── component: radio-choice-group —
         packages/styles/src/radio-choice-group/sk-radio-choice-group.css ───────
         Structural pass: the browser still owns exactly-one selection, constraint
         validation (including `required`), arrow-key roving, tab order, activation,
         submission and reset via the shared `name` attribute. This sheet styles
         native :checked/:disabled/:required/:invalid state; it never maintains or
         infers selection with script. No transition/animation is declared anywhere
         in this sheet, so reduced-motion has nothing to disable (NFR-010). */
      .sk-radio-choice-group {
        box-sizing: border-box;
        min-inline-size: 0;
        max-inline-size: 100%;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .sk-radio-choice-group__legend {
        max-inline-size: 100%;
        padding: 0;
        overflow-wrap: anywhere;
        color: var(--sk-fg-default);
        font-family: var(--sk-font-sans);
        font-size: var(--sk-text-base);
        font-weight: var(--sk-weight-semibold);
        text-align: start;
      }

      .sk-radio-choice-group__options {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(
            min(100%, calc(var(--sk-space-12) + var(--sk-space-12))),
            1fr
          )
        );
        gap: var(--sk-space-2);
        min-inline-size: 0;
        max-inline-size: 100%;
        margin-block-start: var(--sk-space-3);
      }

      .sk-radio-choice-group__choice {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: auto minmax(min-content, 2fr) minmax(0, 1fr);
        align-items: center;
        gap: var(--sk-space-2);
        /* --sk-space-9 is 3rem/48px — the token at or above the 44px NFR-009
           interactive-target floor, pinned over the full label. */
        min-block-size: var(--sk-space-9);
        min-inline-size: 0;
        max-inline-size: 100%;
        padding: var(--sk-space-2);
        color: var(--sk-fg-body);
        background: var(--sk-surface-card);
        border-color: var(--sk-border-default);
        border-style: solid;
        border-width: var(--sk-border-width-1);
        border-radius: var(--sk-radius-sm);
        font-family: var(--sk-font-sans);
        font-size: var(--sk-text-sm);
        font-weight: var(--sk-weight-normal);
        text-align: start;
      }

      .sk-radio-choice-group__control {
        inline-size: var(--sk-space-4);
        block-size: var(--sk-space-4);
        margin: 0;
        scroll-margin-block: var(--sk-space-6);
        accent-color: var(--sk-color-yellow);
      }

      .sk-radio-choice-group__label {
        min-inline-size: 0;
        max-inline-size: 100%;
        overflow-wrap: anywhere;
      }

      .sk-radio-choice-group__secondary-value {
        min-inline-size: 0;
        max-inline-size: 100%;
        overflow-wrap: anywhere;
        color: var(--sk-fg-muted);
        font-family: var(--sk-font-mono);
        font-size: var(--sk-text-xs);
        text-align: end;
      }

      .sk-radio-choice-group__choice:has(
        .sk-radio-choice-group__control:not(:disabled)
      ) {
        cursor: pointer;
      }

      .sk-radio-choice-group__choice:has(
        .sk-radio-choice-group__control:checked
      ) {
        background: var(--sk-bg-pill);
        border-color: var(--sk-border-strong);
        border-style: double;
        border-width: var(--sk-border-width-2);
        font-weight: var(--sk-weight-semibold);
      }

      .sk-radio-choice-group__choice:has(
          .sk-radio-choice-group__control:not(:disabled)
        ):hover {
        background: var(--sk-bg-pill);
        border-style: dashed;
        font-weight: var(--sk-weight-medium);
      }

      .sk-radio-choice-group__choice:has(
          .sk-radio-choice-group__control:not(:disabled)
        ):active {
        background: var(--sk-surface-muted);
        border-style: solid;
        border-width: var(--sk-border-width-2);
        font-weight: var(--sk-weight-semibold);
      }

      .sk-radio-choice-group__choice:has(
        .sk-radio-choice-group__control:focus-visible
      ) {
        border-color: var(--sk-border-focus);
        border-style: dashed;
        border-width: var(--sk-border-width-2);
        font-weight: var(--sk-weight-medium);
      }

      .sk-radio-choice-group__control:focus-visible {
        outline-color: var(--sk-border-focus);
        outline-style: solid;
        outline-width: var(--sk-border-width-2);
        outline-offset: calc(var(--sk-border-width-2) * -1);
      }

      .sk-radio-choice-group__choice:has(
        .sk-radio-choice-group__control:disabled
      ) {
        color: var(--sk-fg-muted);
        border-style: dotted;
        cursor: not-allowed;
      }

      .sk-radio-choice-group__control:disabled {
        cursor: not-allowed;
      }

      /* Required/invalid is a GROUP-level native constraint-validation state: every
         radio in a required group reports `:invalid` until any one of them is checked.
         The cue lives on the legend, distinct from any per-choice cue above. */
      .sk-radio-choice-group:has(
        .sk-radio-choice-group__control:required:invalid
      ) .sk-radio-choice-group__legend {
        padding-block-end: var(--sk-space-2);
        color: var(--sk-color-red);
        border-block-end-color: var(--sk-color-red);
        border-block-end-style: solid;
        border-block-end-width: var(--sk-border-width-2);
      }

      @media (forced-colors: active) {
        .sk-radio-choice-group__choice:has(
          .sk-radio-choice-group__control:checked
        ) {
          border-block-end-color: Highlight;
          border-block-end-style: double;
          border-block-end-width: var(--sk-border-width-4);
        }

        .sk-radio-choice-group__control:focus-visible {
          outline-color: Highlight;
          outline-width: var(--sk-border-width-4);
          outline-offset: calc(var(--sk-border-width-4) * -1);
        }

        .sk-radio-choice-group__choice:has(
          .sk-radio-choice-group__control:disabled
        ) {
          border-block-end-color: GrayText;
          border-block-end-style: dotted;
          border-block-end-width: var(--sk-border-width-4);
        }

        .sk-radio-choice-group:has(
          .sk-radio-choice-group__control:required:invalid
        ) .sk-radio-choice-group__legend {
          border-block-end-color: LinkText;
          border-block-end-style: solid;
          border-block-end-width: var(--sk-border-width-4);
        }
      }

      /* ── component: form-field — packages/styles/src/form-field/sk-form-field.css */
      .sk-form-field {
        display: flex;
        flex-direction: column;
        gap: var(--sk-space-2);
      }

      .sk-form-field__label {
        font-family: var(--sk-font-sans);
        font-size: var(--sk-text-sm);
        font-weight: var(--sk-weight-medium);
        color: var(--sk-fg-default);
      }

      .sk-form-field__description {
        font-size: var(--sk-text-xs);
        color: var(--sk-fg-muted);
      }

      .sk-form-field--error .sk-form-field__description {
        color: var(--sk-fg-error);
      }

      .sk-input {
        width: 100%;
        padding: var(--sk-space-3) var(--sk-space-4);
        background: var(--sk-surface-input);
        border: var(--sk-border-width-1) solid var(--sk-border-control);
        border-radius: var(--sk-radius-sm);
        font-family: var(--sk-font-sans);
        font-size: var(--sk-text-base);
        color: var(--sk-fg-default);
        outline: none;
        /* --sk-space-9 is 3rem/48px — the closest token at or above the 44px NFR-001
           target-size floor. Declared, not inferred; see the library source note. */
        min-block-size: var(--sk-space-9);
        transition:
          border-color var(--sk-motion-duration-fast) var(--sk-motion-ease-out),
          box-shadow var(--sk-motion-duration-fast) var(--sk-motion-ease-out);
        box-sizing: border-box;
      }

      .sk-input::placeholder {
        color: var(--sk-fg-muted);
      }

      .sk-input:focus,
      .sk-input.is-focused {
        border-color: var(--sk-border-focus);
        box-shadow: var(--sk-shadow-focus);
      }

      .sk-input[aria-invalid="true"] {
        border-color: var(--sk-border-control-invalid);
      }

      .sk-input:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── component: button — packages/styles/src/button/sk-button.css ───────── */
      .sk-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--sk-space-2);
        padding: var(--sk-space-3) var(--sk-space-7);
        border: 1px solid transparent;
        border-radius: var(--sk-radius-pill);
        font-family: var(--sk-font-sans);
        font-size: var(--sk-text-base);
        font-weight: var(--sk-weight-medium);
        line-height: 1;
        cursor: pointer;
        transition:
          box-shadow var(--sk-motion-duration-fast) var(--sk-motion-ease-out),
          border-color var(--sk-motion-duration-fast) var(--sk-motion-ease-out),
          background var(--sk-motion-duration-fast) var(--sk-motion-ease-out);
        text-decoration: none;
        position: relative;
      }

      /* Primary variant — yellow fill, dark ink text, pill shape */
      .sk-button--primary {
        background: var(--sk-color-yellow);
        color: var(--sk-fg-on-primary);
        border-color: transparent;
      }

      .sk-button--primary:hover {
        box-shadow: var(--sk-shadow-glow-primary);
      }

      .sk-button--primary:active {
        transform: scale(0.97);
      }

      /* Secondary variant — transparent background, border, default text */
      .sk-button--secondary {
        background: transparent;
        color: var(--sk-fg-default);
        border-color: var(--sk-border-default);
      }

      .sk-button--secondary:hover {
        border-color: var(--sk-border-strong);
      }

      /* Small size modifier */
      .sk-button--sm {
        padding: var(--sk-space-2) var(--sk-space-5);
        font-size: var(--sk-text-sm);
      }

      .sk-button:focus-visible {
        outline: var(--sk-border-width-2) solid var(--sk-border-focus);
        outline-offset: var(--sk-border-width-2);
      }

      /* Disabled state */
      .sk-button:disabled,
      .sk-button[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ============================================================================
       * 3. Page composition. Consumer-owned layout only: no --sk-* token is
       *    redefined, no raw colour is authored, and no sk-* class is extended.
       * ========================================================================= */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-block-size: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--sk-space-7) var(--sk-space-5);
        background: var(--sk-surface-page);
        color: var(--sk-fg-body);
        font-family: var(--sk-font-sans);
        font-size: var(--sk-text-base);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .connect-panel {
        inline-size: 100%;
        max-inline-size: 30rem;
        display: flex;
        flex-direction: column;
        gap: var(--sk-space-6);
        box-shadow: var(--sk-shadow-elev);
      }

      .connect-panel__header {
        display: flex;
        flex-direction: column;
        gap: var(--sk-space-2);
      }

      .connect-panel__title {
        margin: 0;
        font-family: var(--sk-font-display);
        font-size: var(--sk-text-2xl);
        font-weight: var(--sk-weight-semibold);
        line-height: 1.2;
        color: var(--sk-fg-default);
        text-wrap: balance;
      }

      .connect-panel__summary {
        margin: 0;
        font-size: var(--sk-text-sm);
        color: var(--sk-fg-muted);
        text-wrap: pretty;
      }

      .connect-panel__actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--sk-space-3);
        padding-block-start: var(--sk-space-5);
        border-block-start: var(--sk-border-width-1) solid var(--sk-border-default);
      }

      /* The 44px target floor expressed with the same idiom the library uses on its
         own controls (.sk-input, .sk-radio-choice-group__choice): --sk-space-9. The
         button's own padding box measures 42px, just under the floor. */
      .connect-panel__save {
        min-block-size: var(--sk-space-9);
      }

      @media (max-width: 30rem) {
        .connect-panel.sk-card {
          padding: var(--sk-space-5);
        }

        .connect-panel__actions .connect-panel__save {
          inline-size: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="connect-page" data-od-id="workspace-connection-page">
      <form class="sk-card connect-panel" data-od-id="workspace-connection-form">
        <header class="connect-panel__header" data-od-id="panel-header">
          <h1 class="connect-panel__title" data-od-id="panel-title">
            Workspace connection
          </h1>
          <p class="connect-panel__summary" data-od-id="panel-summary">
            Pick the workspace this machine connects to, then name the connection.
          </p>
        </header>

        <fieldset class="sk-radio-choice-group" data-od-id="workspace-choice-group">
          <legend class="sk-radio-choice-group__legend">Connect a workspace</legend>
          <div class="sk-radio-choice-group__options">
            <label
              class="sk-radio-choice-group__choice"
              for="workspace-acme"
              data-od-id="workspace-choice-acme"
              ><input
                id="workspace-acme"
                class="sk-radio-choice-group__control"
                type="radio"
                name="workspace"
                value="acme"
                required
                checked
              /><span class="sk-radio-choice-group__label">Acme</span
              ><span class="sk-radio-choice-group__secondary-value">acme</span></label
            >
            <label
              class="sk-radio-choice-group__choice"
              for="workspace-acme-platform"
              data-od-id="workspace-choice-acme-platform"
              ><input
                id="workspace-acme-platform"
                class="sk-radio-choice-group__control"
                type="radio"
                name="workspace"
                value="acme-platform"
                required
              /><span class="sk-radio-choice-group__label">Acme / Platform</span
              ><span class="sk-radio-choice-group__secondary-value"
                >acme/platform</span
              ></label
            >
            <label
              class="sk-radio-choice-group__choice"
              for="workspace-northwind"
              data-od-id="workspace-choice-northwind"
              ><input
                id="workspace-northwind"
                class="sk-radio-choice-group__control"
                type="radio"
                name="workspace"
                value="northwind"
                required
              /><span class="sk-radio-choice-group__label">Northwind</span
              ><span class="sk-radio-choice-group__secondary-value"
                >northwind</span
              ></label
            >
            <label
              class="sk-radio-choice-group__choice"
              for="workspace-orbital"
              data-od-id="workspace-choice-orbital"
              ><input
                id="workspace-orbital"
                class="sk-radio-choice-group__control"
                type="radio"
                name="workspace"
                value="orbital"
                required
              /><span class="sk-radio-choice-group__label">Orbital</span
              ><span class="sk-radio-choice-group__secondary-value">orbital</span></label
            >
          </div>
        </fieldset>

        <div class="sk-form-field" data-od-id="display-name-field">
          <label class="sk-form-field__label" for="display-name">Display name</label>
          <input
            class="sk-input"
            id="display-name"
            name="display_name"
            type="text"
            placeholder="Laptop (work)"
            autocomplete="off"
            spellcheck="false"
            required
            aria-describedby="display-name-hint"
          />
          <span class="sk-form-field__description" id="display-name-hint"
            >Shown wherever this connection is listed.</span
          >
        </div>

        <footer class="connect-panel__actions" data-od-id="panel-actions">
          <button
            class="sk-button sk-button--primary connect-panel__save"
            type="submit"
            data-od-id="save-connection"
          >
            Save connection
          </button>
        </footer>
      </form>
    </main>

    <script>
      // Static page: native constraint validation still runs (it fires before this
      // handler, so an empty display name or an unselected workspace surfaces the
      // browser's own message). There is no backend here, so a valid submit is
      // stopped rather than reported as saved.
      document
        .querySelector('[data-od-id="workspace-connection-form"]')
        .addEventListener("submit", function (event) {
          event.preventDefault();
        });
    </script>
  </body>
</html>
