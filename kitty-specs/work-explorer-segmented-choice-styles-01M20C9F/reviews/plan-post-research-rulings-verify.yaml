  - ruling: PLAN-FRESH2-001
    status: APPLIED-CORRECTLY
    notes: >
      plan.md's IC-04 "Sequencing/depends-on" block (lines ~366-378) now states the full,
      explicit, five-step CI-authoritative procedure: (1) author the test() blocks' assertions
      only once IC-01's distinguishing declarations and IC-03's forced-colors block have landed
      and the LIVE block is green ("against the CSS's final, fully-differentiated, shipped
      state, not the scaffold pass"); (2) explicitly "do NOT run --update-snapshots locally and
      do NOT locally capture the baseline PNGs", citing the font-rasterization/clipped-box-
      dimension divergence and the stub component's 312x38-local-vs-336x34-CI precedent; (3)
      push the reviewed PR head so CI runs and produces the visual-regression-diffs artifact;
      (4) pull the required baseline PNGs from that artifact and commit exactly those
      CI-produced files, never a locally-rendered substitute; (5) rerun the applicable
      checks/review at the new exact head rather than treating the earlier review as still
      covering it. This resolves the original ambiguity the finding flagged (round 1's "first-
      run"/"whatever DOM/CSS state exists ... becomes the committed baseline" language, which
      read as a local-capture instruction next to the other two blocks' explicit local command
      sequences). Verified both cited sources live: docs/contributing/adding-a-component.md §8
      ("Adding a component" > "8. Visual baseline", lines 391-394) reads "Baselines are
      CI-authoritative — local font metrics differ. Take them from the visual-regression-diffs
      artifact rather than from a local run." — matching plan.md's citation. And
      apps/storybook/src/tests/visual.spec.ts lines 27-31 read (verbatim, confirmed by direct
      read): "BASELINES ARE CI-AUTHORITATIVE. These PNGs were shot on the ubuntu-latest runner,
      not locally: font rasterization differs and clipping makes the component's box size part
      of the assertion, so a locally-shot baseline fails CI on dimensions alone (312x38 local vs
      336x34 CI for the stub). Refresh them from the visual-regression-diffs artifact of a CI
      run, never with a local --update-snapshots." — an exact match to what plan.md quotes and
      paraphrases. No leftover local-capture-reading language remains in the section.

