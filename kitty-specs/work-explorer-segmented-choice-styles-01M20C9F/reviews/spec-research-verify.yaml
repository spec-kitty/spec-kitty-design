      aria-label="View by"` — and lays out its children responsively." Both are genuinely
      "e.g."-qualified, no standalone mandate. data-model.md's Entity 1 table row (line 35) now
      reads "No — illustrative; spec.md's Acceptance Scenario 1 and Key Entities section both offer
      `role="group" aria-label="…"` only as an "e.g." example. The binding requirement is that the
      group carries an accessible group name by some valid mechanism, not specifically this literal
      attribute." This is factually correct and matches spec.md's actual wording exactly. Grepped
      both files for `role="group"` — no other row or sentence in data-model.md or research.md
      still asserts it as a hard requirement, so no dangling contradiction was introduced. The
      Traceability section's "adds no requirement beyond spec.md ... already state as binding"
      claim is now accurate for this row too.

