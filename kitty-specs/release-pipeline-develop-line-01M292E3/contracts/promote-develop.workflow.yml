# Contract for the `promote-develop` JOB added to `.github/workflows/ci-quality.yml`
# (REL1, #362, FR-007/FR-008/FR-010).
#
# REVISED after the post-plan squad's B3/B4/M1-M5 findings. This is no longer a standalone
# workflow file — research.md R15 explains why it now lives INSIDE ci-quality.yml, `needs: [gate]`,
# so the train's own ~26-34 minute quality gate (measured, R15) is what this job's start waits on,
# not a poll loop reading a status that no ruleset actually requires. See
# contracts/ci-quality-integration.md for the OTHER edits this mission makes to ci-quality.yml
# (the four heavy jobs' promote/* skip, the `gate` job's matching tolerance) and to pr-preview.yml.
#
# Trigger stays a real `push` to train/elements-first (ci-quality.yml's existing push trigger,
# unchanged) — this job is gated by its own `if:`, not a separate `on:` block. `workflow_dispatch`
# is added to ci-quality.yml's `on:` for the future (research.md R18): it cannot actually be
# invoked until this exact file reaches `main`, which only happens at the operator's later
# train->main landing — stated here so the job's design does not silently assume it works sooner.
#
# Concurrency: ci-quality.yml's own `concurrency: { group: ci-quality-${{ github.ref }},
# cancel-in-progress: true }` already serialises runs PER REF. Since this job only ever runs for
# pushes to the one ref `refs/heads/train/elements-first`, that existing group already queues
# correctly for this job's purposes — no second, promotion-specific concurrency group is added.

  promote-develop:
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/train/elements-first'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the poll loop itself is capped at 10m (research.md R5, explicitly a
                           # provisional estimate pending recalibration against the first real
                           # cycle) — this leaves headroom for checkout, token mint, git/API calls
    permissions:
      contents: read   # actions/checkout's OWN pre-mint clone step only; every GitHub-write after
                        # that happens on the App token (research.md R4), never this job's own
                        # GITHUB_TOKEN
    steps:
      # ORDER (M4, research.md R19), cheapest and most information-bearing first:
      # 1. enable switch (no I/O)  2. develop-exists via remote ls-remote (no auth needed, public
      # repo)  3. secrets  4. mint + checkout-with-token  5. App-scope guard (M5)

      - name: "[ENFORCED] Enable switch"
        id: enabled
        env:
          ENABLED: ${{ vars.PROMOTE_DEVELOP_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::PROMOTE_DEVELOP_ENABLED is not 'true' — promotion is disabled. Doing nothing."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "[ENFORCED] develop exists? (remote check, no auth needed — public repo)"
        id: develop-exists
        if: steps.enabled.outputs.run == 'true'
        run: |
          if git ls-remote --exit-code https://github.com/spec-kitty/spec-kitty-design.git refs/heads/develop >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::develop does not exist yet — no-op (FR-007(c)). Not an error."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # research.md R7: secrets cannot be tested in `if:` directly — read into env, check in the shell.
      - name: "[ENFORCED] Fail fast if the release App's credentials are missing"
        if: steps.enabled.outputs.run == 'true' && steps.develop-exists.outputs.exists == 'true'
        env:
          APP_ID: ${{ secrets.SK_DESIGN_RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.SK_DESIGN_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::SK_DESIGN_RELEASE_APP_ID and/or SK_DESIGN_RELEASE_APP_PRIVATE_KEY repository secrets are not set."
            echo "::error::The develop-promotion job cannot mint a token without them and will not pretend to have promoted anything."
            echo "::error::See docs/architecture/branch-model.md (Operator Actions) for how to create and install the App and add these secrets."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # actions/create-github-app-token v3.2.0
        id: mint
        if: steps.enabled.outputs.run == 'true' && steps.develop-exists.outputs.exists == 'true'
        with:
          app-id: ${{ secrets.SK_DESIGN_RELEASE_APP_ID }}
          private-key: ${{ secrets.SK_DESIGN_RELEASE_APP_PRIVATE_KEY }}
          # Neither `owner` nor `repositories` set: the App is installed on spec-kitty-design ONLY
          # (spec.md Recorded Decision), so the default scope already is this one repo. The
          # runtime guard below is defense in depth against that install ever being widened.

      # B3: mint BEFORE checkout, then checkout WITH the App token — persist-credentials (default
      # true) then makes every later `git` command (including `git push`) already authenticate as
      # the App, with no further credential wiring (research.md R14, verified against the action's
      # own README pattern).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
        if: steps.enabled.outputs.run == 'true' && steps.develop-exists.outputs.exists == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.mint.outputs.token }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # actions/setup-node v6.4.0
        if: steps.enabled.outputs.run == 'true' && steps.develop-exists.outputs.exists == 'true'
        with: { node-version: '22' }

      - name: "[ENFORCED] App-scope runtime guard (M5) — fail closed unless installed on this repo only"
        if: steps.enabled.outputs.run == 'true' && steps.develop-exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: node scripts/promote-develop.mjs assert-scope

      - name: "[ENFORCED] Set the App's bot identity for the commits this job authors"
        if: steps.enabled.outputs.run == 'true' && steps.develop-exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          user_id=$(gh api "/users/${{ steps.mint.outputs.app-slug }}[bot]" --jq .id)
          git config --global user.name "${{ steps.mint.outputs.app-slug }}[bot]"
          git config --global user.email "${user_id}+${{ steps.mint.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: "[ENFORCED] Promote train/elements-first to develop"
        if: steps.enabled.outputs.run == 'true' && steps.develop-exists.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROMOTE_SOURCE_REF: ${{ vars.PROMOTE_DEVELOP_SOURCE_BRANCH || 'train/elements-first' }}
        run: node scripts/promote-develop.mjs run
