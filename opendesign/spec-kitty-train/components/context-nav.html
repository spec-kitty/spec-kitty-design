/* component: context-nav — packages/styles/src/context-nav/sk-context-nav.css */
/* @spec-kitty/styles — native light-DOM context navigation presentation (#256, #264) */
/* Consumers own navigation semantics, links, order, current state, icons, and copy. */

.sk-context-nav {
  box-sizing: border-box;
  inline-size: 100%;
  min-inline-size: 0;
  max-inline-size: 100%;
  color: var(--sk-fg-body);
  font-family: var(--sk-font-sans);
  font-size: var(--sk-text-sm);
  overflow-wrap: anywhere;
}

.sk-context-nav__group {
  min-inline-size: 0;
}

.sk-context-nav__group + .sk-context-nav__group {
  margin-block-start: var(--sk-space-5);
}

.sk-context-nav__heading {
  margin: 0;
  padding-block: var(--sk-space-2);
  padding-inline: var(--sk-space-3);
  color: var(--sk-fg-muted);
  font-size: var(--sk-text-xs);
  font-weight: var(--sk-weight-semibold);
}

.sk-context-nav__list,
.sk-context-nav__children {
  min-inline-size: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

.sk-context-nav__item {
  min-inline-size: 0;
}

.sk-context-nav__link {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  inline-size: 100%;
  min-inline-size: 0;
  max-inline-size: 100%;
  min-block-size: var(--sk-space-9);
  gap: var(--sk-space-3);
  padding-block: var(--sk-space-2);
  padding-inline: var(--sk-space-3);
  color: inherit;
  background: transparent;
  border-inline-start-color: transparent;
  border-inline-start-style: solid;
  border-inline-start-width: var(--sk-border-width-1);
  border-radius: var(--sk-radius-sm);
  font-weight: var(--sk-weight-normal);
  line-height: normal;
  text-decoration: none;
}

.sk-context-nav__link:link,
.sk-context-nav__link:visited {
  color: inherit;
}

.sk-context-nav__link:hover {
  color: var(--sk-fg-default);
  background: var(--sk-surface-pill);
  text-decoration-line: underline;
  text-decoration-thickness: var(--sk-border-width-1);
  text-underline-offset: var(--sk-space-1);
}

.sk-context-nav__link:active {
  background: var(--sk-surface-muted);
  border-inline-start-color: var(--sk-border-strong);
  border-inline-start-style: double;
  border-inline-start-width: var(--sk-border-width-4);
}

.sk-context-nav__link:focus-visible,
.sk-context-nav__overflow-link:focus-visible {
  outline-color: var(--sk-color-accent);
  outline-style: solid;
  outline-width: var(--sk-border-width-2);
  outline-offset: var(--sk-border-width-1);
}

.sk-context-nav__link[aria-current]:not([aria-current="false"]) {
  color: var(--sk-fg-default);
  background: var(--sk-surface-pill);
  border-inline-start-color: var(--sk-color-accent);
  border-inline-start-style: solid;
  border-inline-start-width: var(--sk-border-width-4);
  font-weight: var(--sk-weight-semibold);
}

.sk-context-nav__link[aria-current]:not([aria-current="false"]):active {
  background: var(--sk-surface-muted);
  border-inline-start-style: double;
}

.sk-context-nav__icon {
  flex: 0 0 auto;
  inline-size: var(--sk-space-4);
  block-size: var(--sk-space-4);
}

.sk-context-nav__label {
  flex: 1 1 auto;
  min-inline-size: 0;
}

.sk-context-nav__unavailable {
  box-sizing: border-box;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  inline-size: 100%;
  min-inline-size: 0;
  max-inline-size: 100%;
  min-block-size: var(--sk-space-9);
  gap: var(--sk-space-2) var(--sk-space-3);
  padding-block: var(--sk-space-2);
  padding-inline: var(--sk-space-3);
  color: var(--sk-fg-muted);
  background: transparent;
  border-inline-start-color: var(--sk-border-strong);
  border-inline-start-style: dashed;
  border-inline-start-width: var(--sk-border-width-1);
  border-radius: var(--sk-radius-sm);
  font-weight: var(--sk-weight-normal);
  line-height: normal;
}

.sk-context-nav__unavailable .sk-context-nav__label {
  flex-basis: var(--sk-space-9);
}

.sk-context-nav__annotation {
  flex: 0 1 auto;
  min-inline-size: 0;
  max-inline-size: 100%;
  margin-inline-start: auto;
  font-size: var(--sk-text-xs);
  font-weight: var(--sk-weight-medium);
}

.sk-context-nav__children {
  margin-inline-start: var(--sk-space-3);
  padding-inline-start: var(--sk-space-4);
  border-inline-start-color: var(--sk-border-strong);
  border-inline-start-style: solid;
  border-inline-start-width: var(--sk-border-width-1);
}

.sk-context-nav__children .sk-context-nav__link {
  font-size: var(--sk-text-xs);
}

.sk-context-nav__empty-copy {
  margin: 0;
  padding-block: var(--sk-space-2);
  padding-inline: var(--sk-space-3);
  color: var(--sk-fg-muted);
}

.sk-context-nav__overflow-link {
  display: inline-flex;
  align-items: center;
  min-block-size: var(--sk-space-9);
  margin-inline: var(--sk-space-3);
  color: inherit;
  font-weight: var(--sk-weight-medium);
  text-decoration-line: underline;
  text-decoration-thickness: var(--sk-border-width-1);
  text-underline-offset: var(--sk-space-1);
}

.sk-context-nav__overflow-link:link,
.sk-context-nav__overflow-link:visited {
  color: inherit;
}

.sk-context-nav__overflow-link:hover {
  color: var(--sk-fg-default);
  text-decoration-thickness: var(--sk-border-width-2);
}

@media (forced-colors: active) {
  .sk-context-nav__unavailable {
    color: GrayText;
    border-inline-start-color: GrayText;
  }

  .sk-context-nav__children {
    border-inline-start-color: ButtonText;
  }

  .sk-context-nav__link[aria-current]:not([aria-current="false"]) {
    border-inline-start-color: Highlight;
  }

  .sk-context-nav__link:focus-visible,
  .sk-context-nav__overflow-link:focus-visible {
    outline-color: Highlight;
  }
}
