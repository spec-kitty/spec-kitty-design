/* component: disclosure — packages/styles/src/disclosure/sk-disclosure.css */
/* @spec-kitty/styles — sk-disclosure shared styles */
/* All values use --sk-* tokens only — no hardcoded values */
/*
 * Marker: a CONTENT-drawn glyph, never a background-drawn icon — but the
 * mechanism that keeps it visible under `forced-colors: active` is NOT "content
 * glyphs get recolored automatically". Isolated measurement: `<summary>`
 * (like `<a>`) is mapped to the `LinkText` system color by Chromium's
 * forced-colors algorithm intrinsically — an unstyled `<details><summary>`
 * with zero authored CSS recolors identically. Measured values are
 * `rgb(255,255,0)` (dark scheme) / `rgb(0,0,159)` (light scheme), which are
 * `LinkText`, not `CanvasText` (white/black) — an earlier revision of this
 * comment, the stories file, and the mission plan all named the wrong
 * mechanism and the wrong color. What IS still true and load-bearing: a
 * BACKGROUND-drawn icon does not get any of this automatic treatment, and
 * forcing one to survive via `forced-color-adjust: none` freezes it at its
 * AUTHORED color, which is frequently invisible against the forced-colors
 * background (measured: a dark-grey icon on the dark-scheme forced-colors
 * background). This file therefore never sets `forced-color-adjust: none`
 * anywhere.
 *
 * The [open] marker rules use a CHILD combinator (`>`), not a descendant
 * combinator — `.sk-disclosure[open] .sk-disclosure__summary` would also
 * match an inner, still-closed disclosure's summary when nested (see the
 * Nested story).
 */

.sk-disclosure {
  border: 1px solid var(--sk-border-default);
  border-radius: var(--sk-radius-md);
  background: var(--sk-surface-card);
}

/* display: flex is used deliberately here, WITH a replacement marker
   (the ::before glyph below) shipped in this same file — never flex/grid
   a <summary> without also supplying the marker that replaces the native
   one it silently removes. */
.sk-disclosure__summary {
  display: flex;
  align-items: center;
  gap: var(--sk-space-2);
  padding: var(--sk-space-3) var(--sk-space-4);
  cursor: pointer;
  font-family: var(--sk-font-sans);
  font-size: var(--sk-text-base);
  font-weight: var(--sk-weight-medium);
  color: var(--sk-fg-default);
  list-style: none;
}

.sk-disclosure__summary::-webkit-details-marker {
  display: none;
}

/*
 * The `/ ''` is CSS Generated Content's ALT TEXT syntax, not decoration — measured
 * in-engine: without it, the accessible-name computation for `<summary>` includes
 * `::before`'s generated content, so the CDP accessibility tree reports
 * `"▸ Deployment history"` — every disclosure announces the decorative triangle
 * before its own label, on a control whose open/closed state is already exposed
 * natively via the `aria-expanded`-equivalent `details`/`summary` semantics. The
 * empty alt text (`''`) removes the glyph from the accessible name while the glyph
 * itself keeps painting exactly as before — verified in-engine, not asserted.
 */
.sk-disclosure__summary::before {
  content: '▸' / '';
  display: inline-block;
  color: var(--sk-fg-muted);
  transition: transform var(--sk-motion-duration-fast) var(--sk-motion-ease-out);
}

/* Child combinator — see the file header note. */
.sk-disclosure[open] > .sk-disclosure__summary::before {
  transform: rotate(90deg);
}

/* `outline`, not `box-shadow`: box-shadow computes away under
   `forced-colors: active` (it is not one of the properties the forced-colors
   algorithm preserves), so a box-shadow-only focus ring would disappear
   entirely in forced-colors mode. `outline` is preserved/remapped to a
   system color automatically, the same way `border` is. */
.sk-disclosure__summary:focus-visible {
  outline: 2px solid var(--sk-border-focus);
  outline-offset: 2px;
  border-radius: var(--sk-radius-sm);
}

.sk-disclosure__body {
  padding: 0 var(--sk-space-4) var(--sk-space-4);
  color: var(--sk-fg-body);
  font-family: var(--sk-font-sans);
  font-size: var(--sk-text-sm);
}

/* Reduced motion: disable exactly the one transitioning declaration this
   component owns (the marker's rotation) — scoped to its own selector, not
   a wildcard. There is no working precedent to copy the EFFECT of;
   sk-transition-matrix.css:237 guards `scroll-behavior`, which nothing in
   this repo sets to `smooth`, so it disables nothing. */
@media (prefers-reduced-motion: reduce) {
  .sk-disclosure__summary::before {
    transition: none;
  }
}

/*
 * Forced-colors: nothing to declare for the marker itself (see the file header
 * comment — `<summary>` recolors to `LinkText` intrinsically, and this file
 * never sets `forced-color-adjust: none`). The summary's own `:focus-visible`
 * ring uses `outline` (above), which is preserved/remapped automatically the
 * same way `border` is, so it needs no override here either. See
 * docs/contributing/adding-a-component.md's "Forced-colors and
 * reduced-motion baselines" section for the canonical statement of both
 * mechanisms — restated here only as a pointer, not re-derived.
 */
    </style>
  </head>

    <section id="disclosure" data-od-component="disclosure">
      <h1>disclosure</h1>
      <figure data-od-variant="closed">
        <figcaption>closed</figcaption>
        <details class="sk-disclosure">
          <summary class="sk-disclosure__summary">What changed in this release?</summary>
          <div class="sk-disclosure__body">
            <p>Three bug fixes and one performance improvement to the build pipeline.</p>
          </div>
        </details>
      </figure>
      <figure data-od-variant="long-body">
        <figcaption>long-body</figcaption>
        <details class="sk-disclosure" open>
          <summary class="sk-disclosure__summary">Full changelog</summary>
          <div class="sk-disclosure__body">
            <p>
              This release replaces the legacy build pipeline with a incremental,
              content-addressed cache that skips unaffected packages entirely, cutting
              the median CI build time from eleven minutes to under three. It also
              fixes a race condition in the file watcher that occasionally dropped
              change events on network filesystems, adds a new diagnostic command for
              inspecting the dependency graph, and upgrades the underlying bundler to
              its latest major version, which required updating every plugin
              configuration across the monorepo.
            </p>
          </div>
        </details>
      </figure>
      <figure data-od-variant="nested">
        <figcaption>nested</figcaption>
        <details class="sk-disclosure" open>
          <summary class="sk-disclosure__summary">Deployment history</summary>
          <div class="sk-disclosure__body">
            <p>Three deployments this week. Expand a deployment for its detail:</p>
            <details class="sk-disclosure">
              <summary class="sk-disclosure__summary">2026-09-03 14:02 UTC — v2.4.1</summary>
              <div class="sk-disclosure__body">
                <p>Rolled out to 100% of traffic with no incidents.</p>
              </div>
            </details>
          </div>
        </details>
      </figure>
      <figure data-od-variant="open">
        <figcaption>open</figcaption>
        <details class="sk-disclosure" open>
          <summary class="sk-disclosure__summary">What changed in this release?</summary>
          <div class="sk-disclosure__body">
            <p>Three bug fixes and one performance improvement to the build pipeline.</p>
          </div>
        </details>
      </figure>
    </section>
  </body>
