<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="form-field: 8 static form(s) and its CSS, from @spec-kitty/styles 1.0.0. Copy the &lt;style&gt; block and the markup verbatim; tokens.css is required and not repeated here." />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
/* component: form-field — packages/styles/src/form-field/sk-form-field.css */
/* @spec-kitty/styles — sk-form-field shared styles */
/* All values use --sk-* tokens only — no hardcoded values */

/* ------------------------------------------------------------------ */
/* FormField container                                                  */
/* ------------------------------------------------------------------ */

.sk-form-field {
  display: flex;
  flex-direction: column;
  gap: var(--sk-space-2);
}

.sk-form-field__label {
  font-family: var(--sk-font-sans);
  font-size: var(--sk-text-sm);
  font-weight: var(--sk-weight-medium);
  color: var(--sk-fg-default);
}

.sk-form-field__description {
  font-size: var(--sk-text-xs);
  color: var(--sk-fg-muted);
}

.sk-form-field--error .sk-form-field__description {
  color: var(--sk-fg-error);
}

/* ------------------------------------------------------------------ */
/* FormInput                                                            */
/* ------------------------------------------------------------------ */

.sk-input {
  width: 100%;
  padding: var(--sk-space-3) var(--sk-space-4);
  background: var(--sk-surface-input);
  border: var(--sk-border-width-1) solid var(--sk-border-control);
  border-radius: var(--sk-radius-sm);
  font-family: var(--sk-font-sans);
  font-size: var(--sk-text-base);
  color: var(--sk-fg-default);
  outline: none;
  /* --sk-space-9 is 3rem/48px — the closest token at or above the 44px NFR-001 floor.
     The 44px contract is already satisfied without this declaration: measured directly
     from the CI-rendered work-explorer pattern baselines (#321), this rule's natural
     content-driven height (padding + border + this control's real line-height in that
     composition, NOT the isolated Storybook story, whose inherited line-height differs)
     is 45px — already above 44px. What this declaration adds is pinning that height to
     an exact 48px, which is NOT free: in a composition where the control shares a grid
     row with a sibling already at 47px it costs 1px; where it has its own row it costs
     the full 3px (45px -> 48px), confirmed by decoding the border rows of the
     work-explorer-w1-lane-dark (45px -> 48px) and work-explorer-w4-rail-1024
     (45px -> 48px, own row) baseline PNGs pixel-by-pixel. Do not read this cost as a
     defect to revert — it is the declared, disclosed price of expressing a 44px floor
     with this repo's only token at or above it (see sk-confirm-dialog.css:171's
     identical idiom). Do not delete this declaration after measuring some OTHER
     content's height and finding it already >=48px without it — that was exactly the
     mistake an earlier version of this comment made, generalising a measurement taken
     in the isolated form-field story into a false "removing it changes nothing" claim.
     tests/node/form-input-border-target-size-parity.test.ts and
     apps/storybook/src/tests/sk-form-input-contrast-touch-target.spec.ts (FR-007, broken
     as padding+floor together) both depend on it staying declared. */
  min-block-size: var(--sk-space-9);
  transition:
    border-color var(--sk-motion-duration-fast) var(--sk-motion-ease-out),
    box-shadow var(--sk-motion-duration-fast) var(--sk-motion-ease-out);
  box-sizing: border-box;
}

.sk-input::placeholder {
  color: var(--sk-fg-muted);
}

.sk-input:focus,
.sk-input.is-focused {
  border-color: var(--sk-border-focus);
  box-shadow: var(--sk-shadow-focus);
}

.sk-input[aria-invalid="true"] {
  border-color: var(--sk-border-control-invalid);
}

.sk-input:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ------------------------------------------------------------------ */
/* FormTextarea                                                         */
/* ------------------------------------------------------------------ */

.sk-textarea {
  width: 100%;
  padding: var(--sk-space-3) var(--sk-space-4);
  background: var(--sk-surface-input);
  border: 1px solid var(--sk-border-default);
  border-radius: var(--sk-radius-sm);
  font-family: var(--sk-font-sans);
  font-size: var(--sk-text-base);
  color: var(--sk-fg-default);
  outline: none;
  min-height: var(--sk-space-30, 120px);
  resize: vertical;
  transition:
    border-color var(--sk-motion-duration-fast) var(--sk-motion-ease-out),
    box-shadow var(--sk-motion-duration-fast) var(--sk-motion-ease-out);
  box-sizing: border-box;
}

.sk-textarea::placeholder {
  color: var(--sk-fg-muted);
}

.sk-textarea:focus,
.sk-textarea.is-focused {
  border-color: var(--sk-border-focus);
  box-shadow: var(--sk-shadow-focus);
}

.sk-textarea[aria-invalid="true"] {
  border-color: var(--sk-border-control-invalid);
}

.sk-textarea:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
    </style>
  </head>
  <body>
    <section id="form-field" data-od-component="form-field">
      <h1>form-field</h1>
      <figure data-od-variant="default">
        <figcaption>default</figcaption>
        <div class="sk-form-field">
          <label class="sk-form-field__label" for="field-id">Label</label>
          <!-- input or textarea goes here -->
          <span class="sk-form-field__description">Helper text</span>
        </div>
      </figure>
      <figure data-od-variant="form-input-default">
        <figcaption>form-input-default</figcaption>
        <div class="sk-form-field">
          <label class="sk-form-field__label" for="field-default">Email address</label>
          <input
            class="sk-input"
            id="field-default"
            type="email"
            placeholder="you@team.com"
          />
          <span class="sk-form-field__description">We'll never share your email.</span>
        </div>
      </figure>
      <figure data-od-variant="form-input-disabled">
        <figcaption>form-input-disabled</figcaption>
        <div class="sk-form-field">
          <label class="sk-form-field__label" for="field-disabled">Email address</label>
          <input
            class="sk-input"
            id="field-disabled"
            type="email"
            placeholder="you@team.com"
            disabled
          />
          <span class="sk-form-field__description">This field is currently unavailable.</span>
        </div>
      </figure>
      <figure data-od-variant="form-input-error">
        <figcaption>form-input-error</figcaption>
        <div class="sk-form-field sk-form-field--error">
          <label class="sk-form-field__label" for="field-email-error">Email address</label>
          <input
            class="sk-input"
            id="field-email-error"
            type="email"
            value=""
            aria-invalid="true"
            aria-describedby="field-email-error-msg"
          />
          <span
            id="field-email-error-msg"
            class="sk-form-field__description"
            role="alert"
          >Please enter a valid email address.</span>
        </div>
      </figure>
      <figure data-od-variant="form-input-filled">
        <figcaption>form-input-filled</figcaption>
        <div class="sk-form-field">
          <label class="sk-form-field__label" for="field-filled">Email address</label>
          <input
            class="sk-input"
            id="field-filled"
            type="email"
            value="ada@team.com"
          />
          <span class="sk-form-field__description">We'll never share your email.</span>
        </div>
      </figure>
      <figure data-od-variant="form-input-focus">
        <figcaption>form-input-focus</figcaption>
        <div class="sk-form-field">
          <label class="sk-form-field__label" for="field-focus">Workspace name</label>
          <input
            class="sk-input is-focused"
            id="field-focus"
            type="text"
            value="Acme Robotics"
          />
          <span class="sk-form-field__description">Your team's workspace identifier.</span>
        </div>
      </figure>
      <figure data-od-variant="form-textarea-default">
        <figcaption>form-textarea-default</figcaption>
        <div class="sk-form-field">
          <label class="sk-form-field__label" for="field-textarea-default">What are you trying to ship?</label>
          <textarea
            class="sk-textarea"
            id="field-textarea-default"
            rows="4"
            placeholder="Describe your goal..."
          ></textarea>
          <span class="sk-form-field__description">Keep it brief — one or two sentences.</span>
        </div>
      </figure>
      <figure data-od-variant="form-textarea-error">
        <figcaption>form-textarea-error</figcaption>
        <div class="sk-form-field sk-form-field--error">
          <label class="sk-form-field__label" for="field-textarea-error">What are you trying to ship?</label>
          <textarea
            class="sk-textarea"
            id="field-textarea-error"
            rows="4"
            aria-invalid="true"
            aria-describedby="field-textarea-error-msg"
          ></textarea>
          <span
            id="field-textarea-error-msg"
            class="sk-form-field__description"
            role="alert"
          >This field is required.</span>
        </div>
      </figure>
    </section>
  </body>
</html>
