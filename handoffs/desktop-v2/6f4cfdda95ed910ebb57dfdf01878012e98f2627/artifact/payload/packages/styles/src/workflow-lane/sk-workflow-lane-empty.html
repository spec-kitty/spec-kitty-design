<!-- @spec-kitty/styles — sk-workflow-lane (native empty example) -->
<!-- The empty ordered list remains present; supplied empty copy is its sibling. -->
<section class="sk-workflow-lane" aria-labelledby="workflow-lane-empty-title">
  <header class="sk-workflow-lane__header">
    <h3 class="sk-workflow-lane__title" id="workflow-lane-empty-title">
      Approved
    </h3>
    <span class="sk-workflow-lane__count" aria-label="0 work packages">0</span>
  </header>
  <ol class="sk-workflow-lane__list"></ol>
  <div class="sk-empty-state">
    <h4 class="sk-empty-state__heading">Nothing approved yet</h4>
    <p class="sk-empty-state__body">Approved work packages will appear here.</p>
  </div>
</section>
